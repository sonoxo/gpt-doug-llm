<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPT Doug — Dashboard</title>
<link rel="stylesheet" href="/app.css">
<style>
  body { padding: 24px; max-width: 1100px; margin: 0 auto; }
  .dash-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .dash-header h1 { font-size: 1.2rem; margin: 0; color: var(--text); }
  .dash-header a { color: var(--text-dim); text-decoration: none; font-size: 0.85rem; }
  .dash-header a:hover { color: var(--accent); }
  .stat-row { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat-card { background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; min-width: 140px; }
  .stat-card .label { color: var(--text-dim); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .stat-card .value { color: var(--text); font-size: 1.3rem; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
  th { color: var(--text-dim); font-weight: 500; text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.04em; }
  td { color: var(--text); }
  tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.75rem; }
  .badge.running { background: #17251d; color: var(--accent); border: 1px solid var(--accent-dim); }
  .badge.stopped { background: #1e2b22; color: var(--text-dim); border: 1px solid var(--border); }
  .actions button { background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 4px 10px; font-size: 0.8rem; cursor: pointer; margin-right: 6px; }
  .actions button:hover { border-color: var(--accent-dim); color: var(--accent); }
  .actions button.danger:hover { border-color: var(--danger); color: var(--danger); }
  .empty { color: var(--text-dim); padding: 24px; text-align: center; }
</style>
</head>
<body>
  <div class="dash-header">
    <h1>GPT Doug — Process Dashboard</h1>
    <a href="/">&larr; Back to chat</a>
  </div>

  <div id="stats" class="stat-row"></div>

  <table>
    <thead>
      <tr><th>Project</th><th>Files</th><th>Status</th><th>Port</th><th>PID</th><th>Uptime</th><th>Actions</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty" class="empty" hidden>No projects yet.</div>

  <h2 style="color: var(--text-dim); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.04em; margin: 28px 0 10px;">Paid task orders</h2>
  <table>
    <thead>
      <tr><th>When</th><th>Task</th><th>Status</th><th>Result</th></tr>
    </thead>
    <tbody id="paidRows"></tbody>
  </table>
  <div id="paidEmpty" class="empty" hidden>No orders yet.</div>

<script src="/dashboard.js"></script>
</body>
</html>
