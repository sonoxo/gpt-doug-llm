<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPT Doug — Run a task ($1)</title>
<link rel="stylesheet" href="/app.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
  .card { background: var(--panel-2); border: 1px solid var(--border); border-radius: 14px; padding: 28px; width: 100%; max-width: 440px; }
  .card h1 { font-size: 1.3rem; margin: 0 0 8px; color: var(--text); }
  .hint { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 18px; }
  textarea { width: 100%; background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 10px; font-size: 0.95rem; box-sizing: border-box; resize: vertical; min-height: 100px; }
  button { width: 100%; margin-top: 14px; background: var(--accent); color: #03140a; border: none; padding: 12px; border-radius: 10px; font-weight: 600; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  .error { color: var(--danger); font-size: 0.85rem; margin-top: 10px; display: none; }
  .price { color: var(--accent); font-weight: 700; }
</style>
</head>
<body>
  <div class="card">
    <h1>Run an AI agent task — <span class="price">$1</span></h1>
    <p class="hint">Describe a task. Once payment is confirmed, three specialized local AI agents (planner, executor, reviewer) complete it end-to-end and you get the result.</p>
    <form id="buyForm">
      <textarea id="taskInput" placeholder="e.g. Write a haiku about the ocean, or draft a python function that..." required></textarea>
      <button type="submit" id="submitBtn">Pay $1 &amp; run task</button>
      <div id="buyError" class="error"></div>
    </form>
  </div>
<script src="/buy.js"></script>
</body>
</html>
