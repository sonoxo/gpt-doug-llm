<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPT Doug — Log in</title>
<link rel="stylesheet" href="/app.css">
<style>
  body { display: flex; align-items: center; justify-content: center; height: 100vh; }
  .login-card { background: var(--panel-2); border: 1px solid var(--border); border-radius: 14px; padding: 28px; width: 300px; }
  .login-card h1 { font-size: 1.2rem; margin: 0 0 16px; color: var(--text); }
  .login-card input { width: 100%; background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; }
  .login-card button { width: 100%; background: var(--accent); color: #03140a; border: none; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; }
  .login-error { color: var(--danger); font-size: 0.85rem; margin-top: 8px; display: none; }
</style>
</head>
<body>
  <form class="login-card" id="loginForm">
    <h1>GPT Doug</h1>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" required autofocus />
    <button type="submit">Log in</button>
    <div class="login-error" id="loginError"></div>
  </form>
<script src="/login.js"></script>
</body>
</html>
