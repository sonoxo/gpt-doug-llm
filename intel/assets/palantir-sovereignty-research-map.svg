<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
<title id="title">The Black House Palantir sovereignty research map</title>
<desc id="desc">Animated research flow showing source interview, Palantir documentation, The Black House corroboration, RVIA agentic core, Shadow Glass, Glass Onion, ontology and frontline tools.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05060b"/><stop offset=".55" stop-color="#111326"/><stop offset="1" stop-color="#180b19"/></linearGradient>
  <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7c3aed"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#f97316"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#7c3aed" stroke-opacity=".09"/></pattern>
</defs>
<rect width="1600" height="720" fill="url(#bg)"/><rect width="1600" height="720" fill="url(#grid)"/>
<text x="70" y="88" fill="#f8fafc" font-family="Inter,Arial" font-size="46" font-weight="800">THE BLACK HOUSE // PALANTIR-ASSOCIATED RESEARCH</text>
<text x="72" y="125" fill="#94a3b8" font-family="Inter,Arial" font-size="20">SOURCE → CORROBORATION → ONTOLOGY → AGENTIC CONTROL → OPERATIONAL IMPLEMENTATION</text>
<g font-family="Inter,Arial">
  <g transform="translate(75 205)"><rect width="240" height="150" rx="22" fill="#101426" stroke="#8b5cf6"/><text x="24" y="40" fill="#c4b5fd" font-size="14" font-weight="700">PRIMARY ASSOCIATION</text><text x="24" y="78" fill="white" font-size="25" font-weight="800">BASIS POINTS</text><text x="24" y="108" fill="#cbd5e1" font-size="16">Chad Wahlquist</text><text x="24" y="132" fill="#64748b" font-size="13">Palantir Architect interview</text></g>
  <g transform="translate(390 205)"><rect width="260" height="150" rx="22" fill="#0d1720" stroke="#22d3ee"/><text x="24" y="40" fill="#67e8f9" font-size="14" font-weight="700">FIRST-PARTY CHECK</text><text x="24" y="78" fill="white" font-size="25" font-weight="800">PALANTIR DOCS</text><text x="24" y="108" fill="#cbd5e1" font-size="15">Ontology • AIP • Evals</text><text x="24" y="132" fill="#64748b" font-size="13">Security • Evolve • BYOM</text></g>
  <g transform="translate(730 185)"><rect width="280" height="190" rx="28" fill="#14101d" stroke="#f97316" stroke-width="2" filter="url(#glow)"/><text x="30" y="46" fill="#fdba74" font-size="14" font-weight="700">CORROBORATION CORE</text><text x="30" y="91" fill="white" font-size="31" font-weight="900">THE BLACK HOUSE</text><text x="30" y="124" fill="#cbd5e1" font-size="15">claim ≠ fact ≠ inference</text><text x="30" y="151" fill="#cbd5e1" font-size="15">confidence • gaps • provenance</text><circle cx="246" cy="44" r="7" fill="#22c55e"><animate attributeName="opacity" values=".25;1;.25" dur="1.4s" repeatCount="indefinite"/></circle></g>
  <g transform="translate(1090 205)"><rect width="220" height="150" rx="22" fill="#101426" stroke="#8b5cf6"/><text x="22" y="40" fill="#c4b5fd" font-size="14" font-weight="700">AGENTIC BRAIN</text><text x="22" y="78" fill="white" font-size="24" font-weight="800">RVIA CORE</text><text x="22" y="108" fill="#cbd5e1" font-size="15">skills • handoffs • evals</text><text x="22" y="132" fill="#64748b" font-size="13">bounded tools + memory</text></g>
  <g transform="translate(1370 205)"><rect width="155" height="150" rx="22" fill="#0d1720" stroke="#22d3ee"/><text x="18" y="40" fill="#67e8f9" font-size="13" font-weight="700">CONTROL</text><text x="18" y="76" fill="white" font-size="20" font-weight="800">SHADOW</text><text x="18" y="101" fill="white" font-size="20" font-weight="800">GLASS</text><text x="18" y="130" fill="#64748b" font-size="12">policy boundary</text></g>
</g>
<g stroke="url(#flow)" stroke-width="4" fill="none" stroke-linecap="round"><path d="M315 280H390"/><path d="M650 280H730"/><path d="M1010 280H1090"/><path d="M1310 280H1370"/></g>
<g fill="#22d3ee"><circle r="5"><animateMotion dur="2.6s" repeatCount="indefinite" path="M315 280H390"/></circle><circle r="5"><animateMotion dur="2.8s" repeatCount="indefinite" path="M650 280H730"/></circle><circle r="5"><animateMotion dur="3s" repeatCount="indefinite" path="M1010 280H1090"/></circle><circle r="5"><animateMotion dur="2.2s" repeatCount="indefinite" path="M1310 280H1370"/></circle></g>
<g transform="translate(150 465)" font-family="Inter,Arial"><rect width="1300" height="150" rx="30" fill="#080b14" stroke="#26324f"/><text x="45" y="45" fill="#94a3b8" font-size="14" font-weight="700">IMPLEMENTATION RESULT</text><text x="45" y="88" fill="white" font-size="28" font-weight="800">MODEL-AGNOSTIC AI + GOVERNED ONTOLOGY + BOUNDED AGENTS + EVALS + AUDIT</text><text x="45" y="121" fill="#94a3b8" font-size="17">ZYRA • XUNIA • EYERIS • GPT-DOUG-LLM • VIRGINIA-LLM • FRONTLINE TOOLS</text></g>
<text x="800" y="680" text-anchor="middle" fill="#64748b" font-family="Inter,Arial" font-size="14">INDEPENDENT OPEN-SOURCE RESEARCH • NO PALANTIR ENDORSEMENT OR AFFILIATION CLAIMED</text>
</svg>