name: PINEAL Cell/Patent Safety Checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install offline-capable Python package
        run: python -m pip install -e '.[test]'
      - name: Exercise whole PINEAL suite
        run: python -m pytest -q
      - name: Terminal blink smoke test
        run: python -m pineal --home "$RUNNER_TEMP/pineal" blink --frames 2 --interval 0.001 --no-color
      - name: Local-only sources status
        run: python -m pineal --home "$RUNNER_TEMP/pineal" patents sources
