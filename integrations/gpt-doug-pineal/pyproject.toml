[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-doug-pineal"
version = "0.2.0"
description = "Local-first AI memory, offline federation observability and defensive terminal cortex"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["ontology", "AI memory", "provenance", "brain interface", "local first"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
pineal = "pineal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
