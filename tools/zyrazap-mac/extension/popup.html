<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>zyraZap</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>zyraZap</h1>
        <p>Mac cleanup with backup + verify first.</p>
      </div>
      <span id="statusDot" class="dot"></span>
    </header>

    <section class="card">
      <label>Backup drive / folder</label>
      <input id="backupRoot" value="/Volumes/Elements/ZyraZap-Backup">
      <div class="row">
        <button id="scanBtn">Scan Mac</button>
        <button id="refreshBtn" class="secondary">Refresh</button>
      </div>
      <div id="diskInfo" class="muted"></div>
    </section>

    <section class="card">
      <div class="sectionTitle">
        <strong>Safe cleanup targets</strong>
        <button id="selectAllBtn" class="link">Select all</button>
      </div>
      <div id="targets"></div>
    </section>

    <section class="card">
      <label class="checkline">
        <input type="checkbox" id="dryRun" checked>
        <span>Dry run only (recommended first)</span>
      </label>
      <button id="cleanBtn" class="danger">Zap selected</button>
      <div id="result" class="result"></div>
    </section>

    <footer>zyraZap never accepts arbitrary shell commands. Cleanup is allowlist-only.</footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
