<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">NXYZ Mouse Mic accessibility support layer</title>
<desc id="desc">A user can type or speak a request. Mouse Mic discovers visible controls, matches the intended target, highlights and describes it, and requires confirmation before high-impact actions.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030713"/><stop offset=".5" stop-color="#09142b"/><stop offset="1" stop-color="#16062c"/></linearGradient>
  <linearGradient id="beam"><stop stop-color="#2df6ff"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ff4fd8"/></linearGradient>
  <linearGradient id="card" x2="1" y2="1"><stop stop-color="#0c1d35"/><stop offset="1" stop-color="#190d31"/></linearGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#59e8ff" stroke-opacity=".07"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
  .flow{stroke-dasharray:12 11;animation:flow 2.2s linear infinite}.pulse{animation:pulse 2.8s ease-in-out infinite}.float{animation:float 4s ease-in-out infinite}.d1{animation-delay:-1s}.d2{animation-delay:-2s}.d3{animation-delay:-3s}
  @keyframes flow{to{stroke-dashoffset:-46}}@keyframes pulse{50%{opacity:.7}}@keyframes float{50%{transform:translateY(-6px)}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="560" rx="30" fill="url(#bg)"/><rect width="1200" height="560" rx="30" fill="url(#grid)"/>
<text x="600" y="64" fill="#f7fbff" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800" text-anchor="middle" letter-spacing="3">NXYZ MOUSE MIC</text>
<text x="600" y="98" fill="#87efff" font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="middle" letter-spacing="2">ACCESSIBILITY SUPPORT LAYER • VOICE + KEYBOARD + VISIBLE GUIDANCE</text>

<path class="flow" d="M180 290H350" stroke="url(#beam)" stroke-width="4"/><path class="flow" d="M500 290H670" stroke="url(#beam)" stroke-width="4"/><path class="flow" d="M820 290H990" stroke="url(#beam)" stroke-width="4"/>

<g class="float"><rect x="40" y="205" width="250" height="170" rx="24" fill="url(#card)" stroke="#50eaff"/><text x="165" y="246" fill="#8ff3ff" font-family="ui-monospace,monospace" font-size="14" text-anchor="middle">01 • INTENT</text><text x="165" y="292" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="800" text-anchor="middle">Speak or Type</text><text x="165" y="325" fill="#aebbd0" font-family="Inter,Arial,sans-serif" font-size="14" text-anchor="middle">“Where is Open in VS Code?”</text><circle class="pulse" cx="165" cy="350" r="8" fill="#50eaff" filter="url(#glow)"/></g>
<g class="float d1"><rect x="350" y="185" width="250" height="210" rx="24" fill="url(#card)" stroke="#8b5cf6"/><text x="475" y="226" fill="#c6b6ff" font-family="ui-monospace,monospace" font-size="14" text-anchor="middle">02 • DISCOVER</text><text x="475" y="270" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="800" text-anchor="middle">Scan Visible Controls</text><text x="475" y="306" fill="#aebbd0" font-family="Inter,Arial,sans-serif" font-size="14" text-anchor="middle">Buttons • links • inputs • tabs</text><text x="475" y="333" fill="#aebbd0" font-family="Inter,Arial,sans-serif" font-size="14" text-anchor="middle">Accessible labels + fuzzy match</text><rect x="406" y="350" width="138" height="24" rx="12" fill="#17132f" stroke="#8b5cf6"/><text x="475" y="367" fill="#d8d0ff" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle">LOCAL DOM ANALYSIS</text></g>
<g class="float d2"><rect x="660" y="185" width="250" height="210" rx="24" fill="url(#card)" stroke="#ff4fd8"/><text x="785" y="226" fill="#ffb4ef" font-family="ui-monospace,monospace" font-size="14" text-anchor="middle">03 • GUIDE</text><text x="785" y="270" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="800" text-anchor="middle">Highlight + Describe</text><text x="785" y="306" fill="#aebbd0" font-family="Inter,Arial,sans-serif" font-size="14" text-anchor="middle">Visual outline + screen location</text><text x="785" y="333" fill="#aebbd0" font-family="Inter,Arial,sans-serif" font-size="14" text-anchor="middle">Numbered targets + spoken status</text><rect x="714" y="350" width="142" height="24" rx="12" fill="#261126" stroke="#ff4fd8"/><text x="785" y="367" fill="#ffd1f6" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle">MULTIMODAL FEEDBACK</text></g>
<g class="float d3"><rect x="970" y="205" width="190" height="170" rx="24" fill="url(#card)" stroke="#f7c85e"/><text x="1065" y="246" fill="#ffe29b" font-family="ui-monospace,monospace" font-size="14" text-anchor="middle">04 • ACT</text><text x="1065" y="291" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" text-anchor="middle">Confirm &amp; Click</text><text x="1065" y="324" fill="#aebbd0" font-family="Inter,Arial,sans-serif" font-size="13" text-anchor="middle">Guard high-impact actions</text><text x="1065" y="348" fill="#f7c85e" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle">HUMAN IN CONTROL</text></g>

<text x="600" y="466" fill="#eaf7ff" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">Designed to reduce pointer precision and visual-search demands without bypassing application permissions.</text>
<text x="600" y="505" fill="#7488a8" font-family="ui-monospace,monospace" font-size="12" text-anchor="middle" letter-spacing="2">NXYZ ECOSYSTEM • ACCESSIBILITY-ORIENTED • LOCAL-FIRST • HUMAN-CONFIRMED</text>
</svg>