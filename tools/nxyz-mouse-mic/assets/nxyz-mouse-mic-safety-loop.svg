<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">NXYZ Mouse Mic safety and confirmation loop</title>
<desc id="desc">A requested click is matched to a visible target. Normal actions execute. High-impact actions are paused, highlighted, and require the user to explicitly confirm or cancel.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050914"/><stop offset="1" stop-color="#180c1f"/></linearGradient><linearGradient id="ok"><stop stop-color="#39e8ff"/><stop offset="1" stop-color="#5df2ae"/></linearGradient><linearGradient id="warn"><stop stop-color="#f6c85d"/><stop offset="1" stop-color="#ff5b8f"/></linearGradient></defs>
<rect width="1200" height="520" rx="28" fill="url(#bg)"/>
<text x="600" y="58" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800" text-anchor="middle">HUMAN-CONFIRMED ACTION LOOP</text>
<text x="600" y="88" fill="#8befff" font-family="ui-monospace,monospace" font-size="13" text-anchor="middle" letter-spacing="2">GUIDANCE FIRST • SIGNIFICANT ACTIONS PAUSE FOR EXPLICIT CONFIRMATION</text>
<g font-family="Inter,Arial,sans-serif">
<rect x="70" y="190" width="190" height="110" rx="20" fill="#0b1c31" stroke="#39e8ff"/><text x="165" y="225" fill="#8ff5ff" font-family="ui-monospace,monospace" font-size="12" text-anchor="middle">REQUEST</text><text x="165" y="260" fill="#fff" font-size="20" font-weight="800" text-anchor="middle">“Click …”</text>
<path d="M260 245H390" stroke="#39e8ff" stroke-width="4"/>
<rect x="390" y="170" width="230" height="150" rx="20" fill="#15142d" stroke="#8b5cf6"/><text x="505" y="208" fill="#c9bcff" font-family="ui-monospace,monospace" font-size="12" text-anchor="middle">POLICY CHECK</text><text x="505" y="246" fill="#fff" font-size="20" font-weight="800" text-anchor="middle">High impact?</text><text x="505" y="277" fill="#a9a3bf" font-size="13" text-anchor="middle">deploy • approve • delete</text><text x="505" y="298" fill="#a9a3bf" font-size="13" text-anchor="middle">publish • submit • permission</text>
<path d="M620 225H770" stroke="url(#ok)" stroke-width="4"/><text x="695" y="211" fill="#78f5c6" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle">NO</text>
<rect x="770" y="160" width="210" height="120" rx="20" fill="#0d2925" stroke="#5df2ae"/><text x="875" y="199" fill="#86ffd1" font-family="ui-monospace,monospace" font-size="12" text-anchor="middle">NORMAL ACTION</text><text x="875" y="235" fill="#fff" font-size="20" font-weight="800" text-anchor="middle">Execute click</text><text x="875" y="259" fill="#a8cabe" font-size="12" text-anchor="middle">within page authority</text>
<path d="M505 320V390H690" stroke="url(#warn)" stroke-width="4"/><text x="535" y="372" fill="#ffd68b" font-family="ui-monospace,monospace" font-size="11">YES</text>
<rect x="690" y="330" width="250" height="125" rx="20" fill="#2b1715" stroke="#f6c85d"/><text x="815" y="367" fill="#ffe0a1" font-family="ui-monospace,monospace" font-size="12" text-anchor="middle">PAUSE + HIGHLIGHT</text><text x="815" y="401" fill="#fff" font-size="19" font-weight="800" text-anchor="middle">“confirm click”</text><text x="815" y="429" fill="#d3b9a0" font-size="12" text-anchor="middle">or say “cancel”</text>
<path d="M940 392H1080" stroke="#f6c85d" stroke-width="4"/><rect x="1030" y="340" width="130" height="105" rx="18" fill="#30230f" stroke="#f6c85d"/><text x="1095" y="378" fill="#ffe2a1" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle">USER</text><text x="1095" y="407" fill="#fff" font-size="17" font-weight="800" text-anchor="middle">Decides</text><text x="1095" y="430" fill="#cdbd93" font-size="11" text-anchor="middle">confirm / cancel</text>
</g>
<text x="600" y="492" fill="#71829c" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle" letter-spacing="2">MOUSE MIC DOES NOT BYPASS PALANTIR AUTHENTICATION, AUTHORIZATION, OR APPROVAL CONTROLS</text>
</svg>