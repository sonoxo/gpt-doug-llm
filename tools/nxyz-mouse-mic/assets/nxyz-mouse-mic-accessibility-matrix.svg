<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">NXYZ Mouse Mic accessibility feature matrix</title>
<desc id="desc">A matrix showing interaction barriers and Mouse Mic support: reduced pointer precision, reduced visual search, keyboard fallback, spoken guidance, visible status, motion reduction support, and confirmation for significant actions.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#040915"/><stop offset="1" stop-color="#130923"/></linearGradient><linearGradient id="bar" x2="1"><stop stop-color="#35e7ff"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ff4fd8"/></linearGradient></defs>
<rect width="1200" height="600" rx="28" fill="url(#bg)"/>
<text x="600" y="58" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800" text-anchor="middle">ACCESSIBILITY SUPPORT MATRIX</text>
<text x="600" y="88" fill="#89eeff" font-family="ui-monospace,monospace" font-size="13" text-anchor="middle" letter-spacing="2">MULTIMODAL INPUT • VISIBLE STATE • LOWER POINTER DEMAND • USER CONFIRMATION</text>

<g font-family="Inter,Arial,sans-serif">
<text x="70" y="142" fill="#9badc8" font-size="13" font-weight="700">ACCESS BARRIER / NEED</text><text x="515" y="142" fill="#9badc8" font-size="13" font-weight="700">NXYZ SUPPORT</text><text x="1010" y="142" fill="#9badc8" font-size="13" font-weight="700">STATUS</text>

<g><rect x="55" y="165" width="1090" height="58" rx="14" fill="#0b1830"/><text x="75" y="200" fill="#fff" font-size="16">Precise pointer movement is difficult</text><rect x="500" y="183" width="430" height="20" rx="10" fill="#0c2333"/><rect x="500" y="183" width="402" height="20" rx="10" fill="url(#bar)"/><text x="970" y="200" fill="#8fffd1" font-size="14" font-weight="700">SUPPORTED</text><text x="1080" y="200" fill="#94a7c1" font-size="12" text-anchor="end">voice / typed click targeting</text></g>
<g><rect x="55" y="233" width="1090" height="58" rx="14" fill="#10152d"/><text x="75" y="268" fill="#fff" font-size="16">Finding a control visually takes time</text><rect x="500" y="251" width="430" height="20" rx="10" fill="#16162f"/><rect x="500" y="251" width="410" height="20" rx="10" fill="url(#bar)"/><text x="970" y="268" fill="#8fffd1" font-size="14" font-weight="700">SUPPORTED</text><text x="1080" y="268" fill="#94a7c1" font-size="12" text-anchor="end">highlight + numbered targets</text></g>
<g><rect x="55" y="301" width="1090" height="58" rx="14" fill="#17122d"/><text x="75" y="336" fill="#fff" font-size="16">Speech is unavailable or undesirable</text><rect x="500" y="319" width="430" height="20" rx="10" fill="#201334"/><rect x="500" y="319" width="395" height="20" rx="10" fill="url(#bar)"/><text x="970" y="336" fill="#8fffd1" font-size="14" font-weight="700">SUPPORTED</text><text x="1080" y="336" fill="#94a7c1" font-size="12" text-anchor="end">keyboard popup fallback</text></g>
<g><rect x="55" y="369" width="1090" height="58" rx="14" fill="#20112c"/><text x="75" y="404" fill="#fff" font-size="16">Need nonvisual status feedback</text><rect x="500" y="387" width="430" height="20" rx="10" fill="#2a1330"/><rect x="500" y="387" width="350" height="20" rx="10" fill="url(#bar)"/><text x="970" y="404" fill="#ffe08c" font-size="14" font-weight="700">PARTIAL</text><text x="1080" y="404" fill="#94a7c1" font-size="12" text-anchor="end">speech synthesis; audit needed</text></g>
<g><rect x="55" y="437" width="1090" height="58" rx="14" fill="#241923"/><text x="75" y="472" fill="#fff" font-size="16">Motion sensitivity / reduced motion preference</text><rect x="500" y="455" width="430" height="20" rx="10" fill="#302024"/><rect x="500" y="455" width="410" height="20" rx="10" fill="url(#bar)"/><text x="970" y="472" fill="#8fffd1" font-size="14" font-weight="700">SUPPORTED</text><text x="1080" y="472" fill="#94a7c1" font-size="12" text-anchor="end">SVGs honor Reduce Motion</text></g>
<g><rect x="55" y="505" width="1090" height="58" rx="14" fill="#2b2417"/><text x="75" y="540" fill="#fff" font-size="16">Avoid accidental high-impact activation</text><rect x="500" y="523" width="430" height="20" rx="10" fill="#342a19"/><rect x="500" y="523" width="420" height="20" rx="10" fill="url(#bar)"/><text x="970" y="540" fill="#8fffd1" font-size="14" font-weight="700">SUPPORTED</text><text x="1080" y="540" fill="#94a7c1" font-size="12" text-anchor="end">explicit confirm-click gate</text></g>
</g>
<text x="600" y="586" fill="#6f819d" font-family="ui-monospace,monospace" font-size="11" text-anchor="middle">THIS MATRIX DESCRIBES PRODUCT FEATURES — IT IS NOT A LEGAL OR WCAG CONFORMANCE CERTIFICATION</text>
</svg>