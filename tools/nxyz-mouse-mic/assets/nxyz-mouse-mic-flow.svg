<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">How NXYZ Mouse Mic works</title>
<desc id="desc">Input from voice or keyboard moves through page discovery, target matching, visual and spoken guidance, safety policy, and either click execution or explicit confirmation.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050913"/><stop offset="1" stop-color="#100822"/></linearGradient><linearGradient id="line"><stop stop-color="#35e7ff"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ff4fd8"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>.p{stroke-dasharray:10 9;animation:dash 2s linear infinite}@keyframes dash{to{stroke-dashoffset:-38}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="1200" height="520" rx="28" fill="url(#bg)"/>
<text x="600" y="58" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800" text-anchor="middle">HOW IT WORKS</text>
<text x="600" y="88" fill="#83edff" font-family="ui-monospace,monospace" font-size="13" text-anchor="middle" letter-spacing="2">INTENT → DISCOVERY → MATCH → GUIDANCE → POLICY → ACTION</text>
<path class="p" d="M170 210H295M425 210H550M680 210H805M935 210H1050" stroke="url(#line)" stroke-width="4"/>
<g><rect x="30" y="150" width="140" height="120" rx="18" fill="#0d1b31" stroke="#35e7ff"/><text x="100" y="184" fill="#86f4ff" font-family="ui-monospace,monospace" font-size="12" text-anchor="middle">INPUT</text><text x="100" y="218" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">Voice</text><text x="100" y="244" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">or Keyboard</text></g>
<g><rect x="295" y="150" width="130" height="120" rx="18" fill="#101a34" stroke="#5ddbf7"/><text x="360" y="184" fill="#9befff" font-family="ui-monospace,monospace" font-size="12" text-anchor="middle">DISCOVER</text><text x="360" y="219" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">Visible DOM</text><text x="360" y="244" fill="#9eacc4" font-family="Inter,Arial,sans-serif" font-size="12" text-anchor="middle">controls + labels</text></g>
<g><rect x="550" y="150" width="130" height="120" rx="18" fill="#16142d" stroke="#8b5cf6"/><text x="615" y="184" fill="#c6b6ff" font-family="ui-monospace,monospace" font-size="12" text-anchor="middle">MATCH</text><text x="615" y="219" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">Best Target</text><text x="615" y="244" fill="#aaa2c4" font-family="Inter,Arial,sans-serif" font-size="12" text-anchor="middle">fuzzy label score</text></g>
<g><rect x="805" y="150" width="130" height="120" rx="18" fill="#21102b" stroke="#ff4fd8"/><text x="870" y="184" fill="#ffb4ef" font-family="ui-monospace,monospace" font-size="12" text-anchor="middle">GUIDE</text><text x="870" y="217" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">Highlight</text><text x="870" y="241" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">+ Speak</text></g>
<g><rect x="1050" y="150" width="120" height="120" rx="18" fill="#2c2410" stroke="#f5c85b"/><text x="1110" y="184" fill="#ffe49e" font-family="ui-monospace,monospace" font-size="12" text-anchor="middle">POLICY</text><text x="1110" y="218" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">Safe?</text><text x="1110" y="244" fill="#d7c88e" font-family="Inter,Arial,sans-serif" font-size="12" text-anchor="middle">risk word gate</text></g>
<path d="M1110 270V330H800" fill="none" stroke="#f5c85b" stroke-width="3"/><path d="M1110 330H400" fill="none" stroke="#35e7ff" stroke-width="3"/>
<g><rect x="680" y="320" width="240" height="100" rx="18" fill="#281018" stroke="#ff8ca5"/><text x="800" y="353" fill="#ffb7c6" font-family="ui-monospace,monospace" font-size="12" text-anchor="middle">HIGH IMPACT</text><text x="800" y="383" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">Ask “confirm click”</text><text x="800" y="405" fill="#bba4aa" font-family="Inter,Arial,sans-serif" font-size="12" text-anchor="middle">user remains decision-maker</text></g>
<g><rect x="280" y="320" width="240" height="100" rx="18" fill="#0d2a23" stroke="#57f2b2"/><text x="400" y="353" fill="#8bffd0" font-family="ui-monospace,monospace" font-size="12" text-anchor="middle">NORMAL ACTION</text><text x="400" y="383" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">Execute click</text><text x="400" y="405" fill="#9ec4b8" font-family="Inter,Arial,sans-serif" font-size="12" text-anchor="middle">within current page authority</text></g>
<text x="600" y="475" fill="#7586a4" font-family="ui-monospace,monospace" font-size="12" text-anchor="middle" letter-spacing="2">NO GENERIC WEB CONTROL • NO PERMISSION BYPASS • NO PAID API REQUIRED</text>
</svg>