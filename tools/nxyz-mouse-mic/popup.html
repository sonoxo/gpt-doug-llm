<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NXYZ Mouse Mic</title>
  <style>
    body { width: 320px; margin: 0; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #15151d; color: #fff; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    p { font-size: 12px; line-height: 1.4; opacity: .8; }
    input { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px; border: 1px solid #444; background: #22222c; color: #fff; }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    button { flex: 1; padding: 10px; border: 0; border-radius: 8px; cursor: pointer; font-weight: 700; }
    #send { background: #6f4cff; color: #fff; }
    #listen { background: #2c2c38; color: #fff; }
    .examples { margin-top: 12px; font-size: 11px; opacity: .72; }
  </style>
</head>
<body>
  <h1>NXYZ Mouse Mic</h1>
  <p>Free click guidance. No API key required. Type or speak a command.</p>
  <input id="command" autocomplete="off" placeholder="where is Python Compute module" />
  <div class="row">
    <button id="send">Run command</button>
    <button id="listen">🎙️ Listen</button>
  </div>
  <div class="examples">Examples: “show targets”, “where is New”, “click Python Compute module”, “click number 12”.</div>
  <script src="popup.js"></script>
</body>
</html>
