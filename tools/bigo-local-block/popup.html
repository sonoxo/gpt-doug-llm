<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none'; base-uri 'none'">
<title>Glass Onion / BIGO Local Block</title>
<link rel="stylesheet" href="popup.css">
<script defer src="popup.js"></script>
</head>
<body>
<main>
<p class="eyebrow">GLASS ONION // DEVICE DEFENSE</p>
<h1>BIGO <em>BLOCK</em></h1>
<p class="description">Blocks <strong>bigo.tv</strong> and its subdomains in this Chrome browser. No other websites are affected.</p>
<div class="status" role="status" aria-live="polite"><span id="light" aria-hidden="true"></span><strong id="state">Checking…</strong></div>
<button type="button" id="toggle" disabled>Checking…</button>
<p id="message" aria-live="polite"></p>
<p class="note">This works locally in Chrome. It does not alter BIGO’s algorithms, block its mobile app, or affect other users. You can switch the block off at any time.</p>
</main>
</body>
</html>
