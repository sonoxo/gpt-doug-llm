<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Wakeup3lm Black House ecosystem</title>
<desc id="desc">Animated ontology-first IDE LLM architecture.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050807"/><stop offset="1" stop-color="#0d1511"/></linearGradient>
  <linearGradient id="volt" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7CFF45"/><stop offset=".5" stop-color="#D6FF46"/><stop offset="1" stop-color="#7CFF45"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="520" rx="28" fill="url(#bg)"/>
<rect x="20" y="20" width="1160" height="480" rx="22" fill="none" stroke="#26352d"/>
<text x="60" y="75" fill="#F1F7F3" font-family="ui-monospace,monospace" font-size="30" font-weight="700">WAKEUP3LM // THE BLACK HOUSE IDE LLM</text>
<text x="60" y="110" fill="#9EB2A5" font-family="ui-monospace,monospace" font-size="15">ontology-first • tool-governed • verification-driven • adaptive repo telemetry</text>
<path d="M100 250 H1100" stroke="#26352d" stroke-width="8" stroke-linecap="round"/>
<path d="M100 250 H1100" stroke="url(#volt)" stroke-width="3" stroke-linecap="round" stroke-dasharray="18 22" filter="url(#glow)"><animate attributeName="stroke-dashoffset" values="0;-80" dur="2.8s" repeatCount="indefinite"/></path>
<g font-family="ui-monospace,monospace" text-anchor="middle">
  <g transform="translate(100 250)"><circle r="46" fill="#0A100D" stroke="#7CFF45" stroke-width="2"/><circle r="52" fill="none" stroke="#7CFF45" opacity=".22" stroke-dasharray="8 10"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="12s" repeatCount="indefinite"/></circle><text y="-4" fill="#F2F7F3" font-size="13" font-weight="700">USER</text><text y="16" fill="#8EA096" font-size="10">intent</text></g>
  <g transform="translate(300 250)"><circle r="46" fill="#0A100D" stroke="#7CFF45" stroke-width="2"/><circle r="52" fill="none" stroke="#7CFF45" opacity=".22" stroke-dasharray="8 10"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="11s" repeatCount="indefinite"/></circle><text y="-4" fill="#F2F7F3" font-size="13" font-weight="700">WAKEUP3LM</text><text y="16" fill="#8EA096" font-size="10">model</text></g>
  <g transform="translate(500 250)"><circle r="46" fill="#0A100D" stroke="#7CFF45" stroke-width="2"/><circle r="52" fill="none" stroke="#7CFF45" opacity=".22" stroke-dasharray="8 10"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="10s" repeatCount="indefinite"/></circle><text y="-4" fill="#F2F7F3" font-size="13" font-weight="700">ONTOLOGY</text><text y="16" fill="#8EA096" font-size="10">state + policy</text></g>
  <g transform="translate(700 250)"><circle r="46" fill="#0A100D" stroke="#7CFF45" stroke-width="2"/><circle r="52" fill="none" stroke="#7CFF45" opacity=".22" stroke-dasharray="8 10"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="9s" repeatCount="indefinite"/></circle><text y="-4" fill="#F2F7F3" font-size="13" font-weight="700">TOOLS</text><text y="16" fill="#8EA096" font-size="10">files + runtime</text></g>
  <g transform="translate(900 250)"><circle r="46" fill="#0A100D" stroke="#7CFF45" stroke-width="2"/><circle r="52" fill="none" stroke="#7CFF45" opacity=".22" stroke-dasharray="8 10"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="8s" repeatCount="indefinite"/></circle><text y="-4" fill="#F2F7F3" font-size="13" font-weight="700">VERIFY</text><text y="16" fill="#8EA096" font-size="10">build + repair</text></g>
  <g transform="translate(1100 250)"><circle r="46" fill="#0A100D" stroke="#7CFF45" stroke-width="2"/><circle r="52" fill="none" stroke="#7CFF45" opacity=".22" stroke-dasharray="8 10"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="7s" repeatCount="indefinite"/></circle><text y="-4" fill="#F2F7F3" font-size="13" font-weight="700">SHIP</text><text y="16" fill="#8EA096" font-size="10">preview + deploy</text></g>
</g>
<g font-family="ui-monospace,monospace"><text x="60" y="390" fill="#7CFF45" font-size="16">LIVE REPO PULSE</text><text x="60" y="425" fill="#E8F0EA" font-size="18">Generated from repository state by GitHub Actions</text><text x="60" y="462" fill="#627169" font-size="12">The infographic and capability matrix refresh when Wakeup3lm source, tests, workflows or ontology change.</text></g>
<rect x="35" y="35" width="5" height="450" fill="#7CFF45" opacity=".1"><animate attributeName="x" values="35;1160;35" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".05;.28;.05" dur="8s" repeatCount="indefinite"/></rect>
</svg>
