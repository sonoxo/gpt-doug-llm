services:
  xunia-platform:
    build:
      context: .
    image: xunia-platform:1.0.0
    restart: unless-stopped
    init: true
    ports:
      - "4400:4400"
    env_file:
      - .env
    environment:
      XUNIA_PLATFORM_HOST: 0.0.0.0
      XUNIA_PLATFORM_PORT: 4400
      XUNIA_DATA_DIR: /data
      XUNIA_AUTH_REQUIRED: "1"
    volumes:
      - xunia-platform-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4400/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  xunia-platform-data:
