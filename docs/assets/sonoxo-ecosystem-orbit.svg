<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
<title id="title">XUNIA Ecosystem v4 command map</title>
<desc id="desc">GPT-DOUG-LLM ecosystem visual showing the six-layer AI stack, Black House governance, XUNIA HQ, ZYRA execution, Red House security, Green House public intelligence, Orange House economic scenarios, and Glass Onion geospatial intelligence.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#020712"/><stop offset=".5" stop-color="#0a1024"/><stop offset="1" stop-color="#170625"/></linearGradient>
  <linearGradient id="beam" x2="1"><stop stop-color="#33e6ff"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ff4fc8"/></linearGradient>
  <linearGradient id="core" x2="1" y2="1"><stop stop-color="#111a31"/><stop offset="1" stop-color="#211039"/></linearGradient>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#5be7ff" stroke-opacity=".055"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#55eaff"/></marker>
</defs>
<style>
  .h1{font:900 36px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f8fbff;letter-spacing:2px}.h2{font:700 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#8ceeff;letter-spacing:1.2px}.title{font:900 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff}.sub{font:600 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#b9c9dd}.mono{font:800 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#dff7ff}.tiny{font:700 9.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#91a7c4;letter-spacing:.7px}.chip{font:800 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#07101c}.flow{stroke-dasharray:12 10;animation:flow 2.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-44}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="1040" rx="32" fill="url(#bg)"/><rect width="1200" height="1040" rx="32" fill="url(#grid)"/>
<text x="600" y="54" class="h1" text-anchor="middle">XUNIA ECOSYSTEM v4 // GPT-DOUG-LLM MAX</text>
<text x="600" y="82" class="h2" text-anchor="middle">ONE CONTROL MAP • SEVEN CORE PLANES • SIX AI LAYERS • EVIDENCE-FIRST EXECUTION</text>

<!-- six AI layers -->
<g transform="translate(70 110)">
  <rect width="1060" height="120" rx="24" fill="#07111f" stroke="#2f4968"/>
  <text x="24" y="28" class="mono">6/6 AI ARCHITECTURE</text>
  <g transform="translate(22 46)"><rect width="158" height="48" rx="13" fill="#658ee5"/><text x="79" y="29" class="chip" text-anchor="middle">CLASSICAL AI</text></g>
  <g transform="translate(193 46)"><rect width="158" height="48" rx="13" fill="#42d1c6"/><text x="79" y="29" class="chip" text-anchor="middle">MACHINE LEARNING</text></g>
  <g transform="translate(364 46)"><rect width="158" height="48" rx="13" fill="#a8d46c"/><text x="79" y="29" class="chip" text-anchor="middle">NEURAL NETWORKS</text></g>
  <g transform="translate(535 46)"><rect width="158" height="48" rx="13" fill="#ff8b72"/><text x="79" y="29" class="chip" text-anchor="middle">DEEP LEARNING</text></g>
  <g transform="translate(706 46)"><rect width="158" height="48" rx="13" fill="#df64d4"/><text x="79" y="29" class="chip" text-anchor="middle">GENERATIVE AI</text></g>
  <g transform="translate(877 46)"><rect width="158" height="48" rx="13" fill="#8f6dff"/><text x="79" y="29" class="chip" text-anchor="middle">AGENTIC AI</text></g>
</g>

<!-- human/hub/core -->
<path class="flow" d="M600 245 V285" stroke="url(#beam)" stroke-width="4" marker-end="url(#arrow)"/>
<g transform="translate(395 285)" filter="url(#glow)"><rect width="410" height="92" rx="22" fill="#0c1c30" stroke="#35e7ff" stroke-width="2"/><text x="205" y="34" class="title" text-anchor="middle">XUNIA HQ // HOLO FORGE</text><text x="205" y="58" class="sub" text-anchor="middle">operator interface • RVIA • digital twin • learning • mission view</text><text x="205" y="77" class="tiny" text-anchor="middle">sonoxo/xuniahub</text></g>
<path class="flow" d="M600 377 V417" stroke="url(#beam)" stroke-width="4" marker-end="url(#arrow)"/>
<g transform="translate(350 417)" filter="url(#glow)"><rect width="500" height="110" rx="24" fill="url(#core)" stroke="#9b6dff" stroke-width="2"/><text x="250" y="36" class="title" text-anchor="middle">THE BLACK HOUSE // GPT-DOUG-LLM MAX</text><text x="250" y="62" class="sub" text-anchor="middle">ontology • orchestration • policy • provenance • evidence • AI-layer contract</text><text x="250" y="84" class="tiny" text-anchor="middle">sonoxo/gpt-doug-llm  •  canonical control root</text></g>
<path class="flow" d="M600 527 V567" stroke="url(#beam)" stroke-width="4" marker-end="url(#arrow)"/>
<g transform="translate(395 567)" filter="url(#glow)"><rect width="410" height="92" rx="22" fill="#101a2b" stroke="#ff4fc8" stroke-width="2"/><text x="205" y="34" class="title" text-anchor="middle">ZYRA // GOVERNED EXECUTION</text><text x="205" y="58" class="sub" text-anchor="middle">security gate • approval • bounded tools • audit • CI evidence</text><text x="205" y="77" class="tiny" text-anchor="middle">sonoxo/zyra</text></g>

<!-- domain planes -->
<path class="flow" d="M600 659 V700 M600 700 H145 M600 700 H1055" stroke="url(#beam)" stroke-width="3"/>
<path d="M145 700 V735 M445 700 V735 M755 700 V735 M1055 700 V735" stroke="#55eaff" stroke-width="3" marker-end="url(#arrow)"/>
<g transform="translate(35 735)"><rect width="220" height="132" rx="20" fill="#25101b" stroke="#ff4b55"/><text x="110" y="31" class="title" text-anchor="middle">RED HOUSE</text><text x="110" y="54" class="sub" text-anchor="middle">authorized security</text><text x="110" y="75" class="tiny" text-anchor="middle">findings • risk • remediation</text><text x="110" y="98" class="tiny" text-anchor="middle">sonoxo/theredhouse</text></g>
<g transform="translate(335 735)"><rect width="220" height="132" rx="20" fill="#102219" stroke="#55d36f"/><text x="110" y="31" class="title" text-anchor="middle">GREEN HOUSE</text><text x="110" y="54" class="sub" text-anchor="middle">public situational intel</text><text x="110" y="75" class="tiny" text-anchor="middle">eco • bio • regulatory • events</text><text x="110" y="98" class="tiny" text-anchor="middle">sonoxo/thegreenhouse</text></g>
<g transform="translate(645 735)"><rect width="220" height="132" rx="20" fill="#24190e" stroke="#ff9d3f"/><text x="110" y="31" class="title" text-anchor="middle">ORANGE HOUSE</text><text x="110" y="54" class="sub" text-anchor="middle">economic scenarios</text><text x="110" y="75" class="tiny" text-anchor="middle">projection • stress • planning</text><text x="110" y="98" class="tiny" text-anchor="middle">sonoxo/theorangehouse</text></g>
<g transform="translate(945 735)"><rect width="220" height="132" rx="20" fill="#101b25" stroke="#45d8ff"/><text x="110" y="31" class="title" text-anchor="middle">GLASS ONION</text><text x="110" y="54" class="sub" text-anchor="middle">geospatial public source</text><text x="110" y="75" class="tiny" text-anchor="middle">3D Earth • provenance • correlation</text><text x="110" y="98" class="tiny" text-anchor="middle">sonoxo/gods-eye-viewXUNIA</text></g>

<!-- evidence return -->
<path class="flow" d="M145 867 V905 H600 M445 867 V905 M755 867 V905 M1055 867 V905 H600" fill="none" stroke="#8d6bff" stroke-width="3"/>
<g transform="translate(280 910)"><rect width="640" height="76" rx="18" fill="#08121d" stroke="#2b4258"/><text x="320" y="29" class="mono" text-anchor="middle">EVIDENCE RETURN LOOP</text><text x="320" y="51" class="sub" text-anchor="middle">tests • logs • provenance • artifacts • review • controlled release</text><text x="320" y="68" class="tiny" text-anchor="middle">registry: ecosystem/registry.v4.json  •  gate: ecosystem-v4-gate.yml</text></g>
<text x="600" y="1016" class="tiny" text-anchor="middle">REPOSITORY MEMBERSHIP ≠ EXTERNAL AUTHORIZATION • UPSTREAM ATTRIBUTION PRESERVED • HUMAN AUTHORITY RETAINED</text>
</svg>