<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
<title id="title">GPT-DOUG-LLM MAX six layers of AI</title>
<desc id="desc">GitHub intro infographic showing all six canonical AI layers in GPT-DOUG-LLM MAX: Classical AI, Machine Learning, Neural Networks, Deep Learning, Generative AI, and Agentic AI, with representative capabilities and CI enforcement references.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030713"/><stop offset=".5" stop-color="#0a1026"/><stop offset="1" stop-color="#16072b"/></linearGradient>
  <linearGradient id="agent" x2="1"><stop stop-color="#5b52ff"/><stop offset="1" stop-color="#9d5cff"/></linearGradient>
  <linearGradient id="gen" x2="1"><stop stop-color="#9a4cff"/><stop offset="1" stop-color="#e253d4"/></linearGradient>
  <linearGradient id="deep" x2="1"><stop stop-color="#e05b9d"/><stop offset="1" stop-color="#ff8d6d"/></linearGradient>
  <linearGradient id="nn" x2="1"><stop stop-color="#8bc65b"/><stop offset="1" stop-color="#b7da67"/></linearGradient>
  <linearGradient id="ml" x2="1"><stop stop-color="#22c7bd"/><stop offset="1" stop-color="#58d9d0"/></linearGradient>
  <linearGradient id="classic" x2="1"><stop stop-color="#4779d9"/><stop offset="1" stop-color="#7899ed"/></linearGradient>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#63d7ff" stroke-opacity=".055"/></pattern>
  <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".35"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
  .h1{font:900 38px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f7fbff;letter-spacing:2px}
  .h2{font:700 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#91eaff;letter-spacing:1.6px}
  .layer{font:900 24px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff}
  .chip{font:700 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#0a1020}
  .repo{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#e9f7ff}
  .tiny{font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#8ea6bf;letter-spacing:.8px}
  .ok{font:900 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#6dffb1;letter-spacing:1px}
</style>
<rect width="1200" height="940" rx="32" fill="url(#bg)"/>
<rect width="1200" height="940" rx="32" fill="url(#grid)"/>

<text x="600" y="58" class="h1" text-anchor="middle">GPT-DOUG-LLM MAX // 6 LAYERS OF AI</text>
<text x="600" y="88" class="h2" text-anchor="middle">CLASSICAL → MACHINE LEARNING → NEURAL NETWORKS → DEEP LEARNING → GENERATIVE → AGENTIC</text>
<text x="600" y="115" class="ok" text-anchor="middle">● 6/6 ARCHITECTURE LAYERS DECLARED + CI ENFORCED</text>

