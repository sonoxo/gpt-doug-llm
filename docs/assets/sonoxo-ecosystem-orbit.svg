<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">GPT-DOUG // ZYRA CORE ecosystem interface</title><desc id="desc">Bounded local agentic engineering. Flow: COMMAND to POLICY to AGENT CORE to LOCAL MODEL to VERIFY.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030713"/><stop offset=".48" stop-color="#0b1028"/><stop offset="1" stop-color="#12052a"/></linearGradient><linearGradient id="beam"><stop stop-color="#2df6ff"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#ff3fd1"/></linearGradient><linearGradient id="card" x2="1" y2="1"><stop stop-color="#0c1d35" stop-opacity=".96"/><stop offset="1" stop-color="#180d31" stop-opacity=".96"/></linearGradient><radialGradient id="core"><stop stop-color="#eafcff"/><stop offset=".15" stop-color="#4de8ff"/><stop offset=".48" stop-color="#7c3cff"/><stop offset="1" stop-color="#071023" stop-opacity="0"/></radialGradient><pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#58dfff" stroke-opacity=".09"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>.ring{transform-origin:600px 268px;animation:spin 12s linear infinite}.ring2{transform-origin:600px 268px;animation:spin 8s linear reverse infinite}.beam{stroke-dasharray:14 12;animation:flow 2.2s linear infinite}.core{animation:pulse 2.8s ease-in-out infinite}.node{animation:float 4s ease-in-out infinite}.n1,.n3{animation-delay:-1.2s}.n2{animation-delay:-2s}@keyframes spin{to{transform:rotate(360deg)}}@keyframes flow{to{stroke-dashoffset:-52}}@keyframes pulse{50%{opacity:.72;transform:scale(.94)}}@keyframes float{50%{transform:translateY(-7px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
