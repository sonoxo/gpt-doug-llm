<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">GPT-Doug-LLM-Max project insignia</title>
  <desc id="desc">Circular black, gold, and electric blue insignia representing human and AI collective intelligence grounded by ZYRA ontology and evidence.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0" stop-color="#12345a"/>
      <stop offset="0.52" stop-color="#071423"/>
      <stop offset="1" stop-color="#02070d"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a8"/>
      <stop offset="0.38" stop-color="#d7a62a"/>
      <stop offset="0.7" stop-color="#8b5a08"/>
      <stop offset="1" stop-color="#f4d36f"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9e6ff"/>
      <stop offset="0.5" stop-color="#2aa7ff"/>
      <stop offset="1" stop-color="#0069d9"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="400" cy="400" r="382" fill="#05080d" stroke="url(#gold)" stroke-width="20"/>
  <circle cx="400" cy="400" r="344" fill="url(#bg)" stroke="#d7a62a" stroke-width="4"/>
  <circle cx="400" cy="400" r="306" fill="none" stroke="#315b80" stroke-width="2" stroke-dasharray="8 10" opacity="0.75"/>

  <text x="400" y="92" text-anchor="middle" fill="url(#gold)" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="44" letter-spacing="4">GPT-DOUG-LLM-MAX</text>
  <text x="400" y="132" text-anchor="middle" fill="#cbd8e8" font-family="Arial,Helvetica,sans-serif" font-size="19" letter-spacing="5">HYBRID COLLECTIVE INTELLIGENCE</text>

  <!-- Human / AI split intelligence mark -->
  <path d="M395 208 C325 208 275 260 275 330 C275 375 294 407 325 432 C343 447 350 470 350 500 L395 500 Z" fill="#d6a42b" opacity="0.96" filter="url(#glow)"/>
  <path d="M405 208 C475 208 525 260 525 330 C525 375 506 407 475 432 C457 447 450 470 450 500 L405 500 Z" fill="#178ff0" opacity="0.96" filter="url(#glow)"/>
  <path d="M400 210 L400 500" stroke="#ffffff" stroke-width="8" opacity="0.9"/>

  <!-- Human side -->
  <circle cx="343" cy="300" r="22" fill="none" stroke="#fff0a8" stroke-width="7"/>
  <path d="M310 365 C320 330 367 330 377 365" fill="none" stroke="#fff0a8" stroke-width="7" stroke-linecap="round"/>
  <path d="M332 260 L318 238 M357 259 L370 235 M302 300 L279 291" stroke="#fff0a8" stroke-width="5" stroke-linecap="round"/>

  <!-- AI side -->
  <circle cx="458" cy="286" r="11" fill="#c6ecff"/>
  <circle cx="485" cy="333" r="11" fill="#c6ecff"/>
  <circle cx="445" cy="380" r="11" fill="#c6ecff"/>
  <circle cx="500" cy="405" r="11" fill="#c6ecff"/>
  <path d="M458 286 L485 333 L445 380 L500 405 M458 286 L445 380 M485 333 L500 405" fill="none" stroke="#c6ecff" stroke-width="6"/>

  <!-- Ontology / evidence graph -->
  <circle cx="400" cy="575" r="28" fill="#0c1725" stroke="#f4d36f" stroke-width="7"/>
  <circle cx="300" cy="605" r="18" fill="#0c1725" stroke="#2aa7ff" stroke-width="6"/>
  <circle cx="500" cy="605" r="18" fill="#0c1725" stroke="#2aa7ff" stroke-width="6"/>
  <circle cx="340" cy="670" r="18" fill="#0c1725" stroke="#2aa7ff" stroke-width="6"/>
  <circle cx="460" cy="670" r="18" fill="#0c1725" stroke="#2aa7ff" stroke-width="6"/>
  <path d="M400 575 L300 605 L340 670 L460 670 L500 605 Z M300 605 L460 670 M500 605 L340 670" fill="none" stroke="#6fc5ff" stroke-width="4" opacity="0.85"/>

  <text x="400" y="730" text-anchor="middle" fill="#f8e3a0" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="24" letter-spacing="3">PEOPLE • AGENTS • EVIDENCE • ACTION</text>
  <text x="400" y="765" text-anchor="middle" fill="#9fd5ff" font-family="Arial,Helvetica,sans-serif" font-size="20" letter-spacing="4">ZYRA // SONOXO</text>
</svg>
