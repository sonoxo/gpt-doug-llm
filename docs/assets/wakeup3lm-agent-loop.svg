<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560" role="img" aria-labelledby="t2 d2"><title id="t2">Wakeup3lm coding loop</title><desc id="d2">Eight step autonomous but governed coding loop.</desc><rect width="1400" height="560" rx="28" fill="#080D12"/>
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3DE1FF"/></marker>
  </defs>
  <style>
    .h1{font:700 34px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#F8FBFF}.h2{font:600 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#9FB2C8}
    .title{font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#F8FBFF}.sub{font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#AAB8C8}
    .state{font:800 10px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:1px}.small{font:600 12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#AAB8C8}
  </style>
<text x="70" y="70" class="h1">WAKEUP3LM // VIBE-CODE LOOP</text><text x="70" y="103" class="h2">Every action is observable. Every failure has a return path.</text><g transform="translate(70 150)"><rect width="270" height="118" rx="20" fill="#111821" stroke="#3DE1FF" stroke-width="2"/><circle cx="36" cy="36" r="18" fill="#3DE1FF" opacity=".18"/><text x="36" y="42" text-anchor="middle" class="title" fill="#3DE1FF">1</text><text x="66" y="39" class="title">ASK</text><text x="24" y="78" class="sub">Describe the app or change</text></g><g transform="translate(390 150)"><rect width="270" height="118" rx="20" fill="#111821" stroke="#A970FF" stroke-width="2"/><circle cx="36" cy="36" r="18" fill="#A970FF" opacity=".18"/><text x="36" y="42" text-anchor="middle" class="title" fill="#A970FF">2</text><text x="66" y="39" class="title">PLAN</text><text x="24" y="78" class="sub">Wakeup3lm structures the mission</text></g><g transform="translate(710 150)"><rect width="270" height="118" rx="20" fill="#111821" stroke="#7CFF6B" stroke-width="2"/><circle cx="36" cy="36" r="18" fill="#7CFF6B" opacity=".18"/><text x="36" y="42" text-anchor="middle" class="title" fill="#7CFF6B">3</text><text x="66" y="39" class="title">GROUND</text><text x="24" y="78" class="sub">Ontology + authorized AIP context</text></g><g transform="translate(1030 150)"><rect width="270" height="118" rx="20" fill="#111821" stroke="#FFB454" stroke-width="2"/><circle cx="36" cy="36" r="18" fill="#FFB454" opacity=".18"/><text x="36" y="42" text-anchor="middle" class="title" fill="#FFB454">4</text><text x="66" y="39" class="title">ACT</text><text x="24" y="78" class="sub">Allowlisted tools edit/run/build</text></g><g transform="translate(70 330)"><rect width="270" height="118" rx="20" fill="#111821" stroke="#FFD166" stroke-width="2"/><circle cx="36" cy="36" r="18" fill="#FFD166" opacity=".18"/><text x="36" y="42" text-anchor="middle" class="title" fill="#FFD166">5</text><text x="66" y="39" class="title">VERIFY</text><text x="24" y="78" class="sub">Tests + security gates + preview</text></g><g transform="translate(390 330)"><rect width="270" height="118" rx="20" fill="#111821" stroke="#FF5D73" stroke-width="2"/><circle cx="36" cy="36" r="18" fill="#FF5D73" opacity=".18"/><text x="36" y="42" text-anchor="middle" class="title" fill="#FF5D73">6</text><text x="66" y="39" class="title">REPAIR</text><text x="24" y="78" class="sub">Failures feed the next decision</text></g><g transform="translate(710 330)"><rect width="270" height="118" rx="20" fill="#111821" stroke="#FF6BD6" stroke-width="2"/><circle cx="36" cy="36" r="18" fill="#FF6BD6" opacity=".18"/><text x="36" y="42" text-anchor="middle" class="title" fill="#FF6BD6">7</text><text x="66" y="39" class="title">CHECKPOINT</text><text x="24" y="78" class="sub">Keep evidence + rollback point</text></g><g transform="translate(1030 330)"><rect width="270" height="118" rx="20" fill="#111821" stroke="#2DD4BF" stroke-width="2"/><circle cx="36" cy="36" r="18" fill="#2DD4BF" opacity=".18"/><text x="36" y="42" text-anchor="middle" class="title" fill="#2DD4BF">8</text><text x="66" y="39" class="title">SHIP</text><text x="24" y="78" class="sub">Publish only through approved path</text></g><path d="M340 209 L390 209" stroke="#3DE1FF" stroke-width="3" fill="none" marker-end="url(#arrow)" stroke-dasharray="10 10">
      <animate attributeName="stroke-dashoffset" values="20;0" dur="1.2s" repeatCount="indefinite"/>
    </path><path d="M660 209 L710 209" stroke="#3DE1FF" stroke-width="3" fill="none" marker-end="url(#arrow)" stroke-dasharray="10 10">
      <animate attributeName="stroke-dashoffset" values="20;0" dur="1.2s" repeatCount="indefinite"/>
    </path><path d="M980 209 L1030 209" stroke="#3DE1FF" stroke-width="3" fill="none" marker-end="url(#arrow)" stroke-dasharray="10 10">
      <animate attributeName="stroke-dashoffset" values="20;0" dur="1.2s" repeatCount="indefinite"/>
    </path><path d="M1030 389 L980 389" stroke="#3DE1FF" stroke-width="3" fill="none" marker-end="url(#arrow)" stroke-dasharray="10 10">
      <animate attributeName="stroke-dashoffset" values="20;0" dur="1.2s" repeatCount="indefinite"/>
    </path><path d="M710 389 L660 389" stroke="#3DE1FF" stroke-width="3" fill="none" marker-end="url(#arrow)" stroke-dasharray="10 10">
      <animate attributeName="stroke-dashoffset" values="20;0" dur="1.2s" repeatCount="indefinite"/>
    </path><path d="M390 389 L340 389" stroke="#3DE1FF" stroke-width="3" fill="none" marker-end="url(#arrow)" stroke-dasharray="10 10">
      <animate attributeName="stroke-dashoffset" values="20;0" dur="1.2s" repeatCount="indefinite"/>
    </path><path d="M1200 268 L1200 330" stroke="#3DE1FF" stroke-width="3" fill="none" marker-end="url(#arrow)" stroke-dasharray="10 10">
      <animate attributeName="stroke-dashoffset" values="20;0" dur="1.2s" repeatCount="indefinite"/>
    </path><path d="M70 450 C35 450 35 210 70 210" stroke="#FF5D73" stroke-width="3" fill="none" stroke-dasharray="8 10"><animate attributeName="stroke-dashoffset" values="18;0" dur="1.4s" repeatCount="indefinite"/></path><text x="82" y="492" class="small">repair loop returns failed verification to the next governed decision</text></svg>