<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Virginia LLM Safety Shield Glass Onion Control Plane</title>
  <desc id="desc">Animated vector telemetry showing policy-gated agent execution through layered zero-trust controls.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="24" fill="#07070a"/>
  <rect x="18" y="18" width="1164" height="324" rx="18" fill="none" stroke="#27272a"/>

  <text x="60" y="72" fill="#fafafa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="31" font-weight="700">VIRGINIA-LLM // SAFETY SHIELD</text>
  <text x="60" y="105" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">GLASS ONION • ZERO TRUST • 24-AGENT GOVERNANCE FLEET</text>

  <g transform="translate(182 226)">
    <circle r="92" fill="none" stroke="#27272a" stroke-width="1"/>
    <circle r="72" fill="none" stroke="#3f3f46" stroke-width="1"/>
    <circle r="52" fill="none" stroke="#52525b" stroke-width="1"/>
    <circle r="31" fill="none" stroke="url(#g)" stroke-width="2" filter="url(#glow)">
      <animate attributeName="r" values="27;35;27" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".65;1;.65" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="7" fill="#f97316" filter="url(#glow)"/>
    <g>
      <circle cx="0" cy="-92" r="5" fill="#a855f7"/>
      <circle cx="92" cy="0" r="5" fill="#f97316"/>
      <circle cx="0" cy="92" r="5" fill="#a855f7"/>
      <circle cx="-92" cy="0" r="5" fill="#f97316"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </g>
    <text x="0" y="5" text-anchor="middle" fill="#fafafa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">POLICY</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="316" y="178" fill="#71717a">INTENT</text>
    <text x="410" y="178" fill="#71717a">IDENTITY</text>
    <text x="520" y="178" fill="#71717a">CONTEXT</text>
    <text x="620" y="178" fill="#fafafa">POLICY</text>
    <text x="715" y="178" fill="#71717a">TOOL</text>
    <text x="795" y="178" fill="#71717a">EXECUTION</text>
    <text x="915" y="178" fill="#71717a">EVIDENCE</text>
    <text x="1025" y="178" fill="#71717a">OUTCOME</text>
    <line x1="316" y1="198" x2="1080" y2="198" stroke="#27272a" stroke-width="3"/>
    <line x1="316" y1="198" x2="1080" y2="198" stroke="url(#g)" stroke-width="3" stroke-dasharray="50 714">
      <animate attributeName="stroke-dashoffset" values="0;-764" dur="3.2s" repeatCount="indefinite"/>
    </line>
    <circle cx="316" cy="198" r="6" fill="#a855f7"/><circle cx="431" cy="198" r="6" fill="#a855f7"/>
    <circle cx="536" cy="198" r="6" fill="#a855f7"/><circle cx="642" cy="198" r="6" fill="#f97316"/>
    <circle cx="725" cy="198" r="6" fill="#a855f7"/><circle cx="830" cy="198" r="6" fill="#a855f7"/>
    <circle cx="943" cy="198" r="6" fill="#a855f7"/><circle cx="1050" cy="198" r="6" fill="#f97316"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="350" y="238" width="790" height="62" rx="10" fill="#0f0f13" stroke="#27272a"/>
    <text x="375" y="263" fill="#22c55e" font-size="14">● SHIELD STATUS</text>
    <text x="520" y="263" fill="#fafafa" font-size="14">DENY-BY-DEFAULT</text>
    <text x="690" y="263" fill="#fafafa" font-size="14">HUMAN-GATED</text>
    <text x="830" y="263" fill="#fafafa" font-size="14">APPEND-ONLY AUDIT</text>
    <text x="375" y="286" fill="#a1a1aa" font-size="12">request → verify → classify → evaluate → authorize → execute → prove</text>
    <circle cx="1110" cy="261" r="6" fill="#22c55e">
      <animate attributeName="opacity" values="1;.2;1" dur="1.3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
