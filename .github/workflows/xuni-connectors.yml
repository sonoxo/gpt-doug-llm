name: XUNI Connector Fabric
on:
  push:
    paths:
      - 'xuni_connectors.py'
      - 'xbox_gdk_docs.py'
      - 'tests/test_xuni_connectors.py'
      - 'tests/test_xbox_gdk_docs.py'
      - 'docs/XUNI-CONNECTOR-FABRIC.md'
      - '.github/workflows/xuni-connectors.yml'
  pull_request:
    paths:
      - 'xuni_connectors.py'
      - 'xbox_gdk_docs.py'
      - 'tests/test_xuni_connectors.py'
      - 'tests/test_xbox_gdk_docs.py'
      - 'docs/XUNI-CONNECTOR-FABRIC.md'
      - '.github/workflows/xuni-connectors.yml'
jobs:
  verify:
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pytest -q tests/test_xuni_connectors.py tests/test_xbox_gdk_docs.py
