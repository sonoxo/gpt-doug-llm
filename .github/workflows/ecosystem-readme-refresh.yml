name: Ecosystem Diagram Review (No Direct Main Writes)

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate_ecosystem_diagrams.py"
      - "scripts/generate_kraken_infra_diagram.py"
      - "wakeup3lm/**"
      - "agents/**"
      - "kraken_jutsu/**"
      - "the-black-house/**"
      - "tests/**"
      - "safety-shield/**"
      - "foundry/**"
      - ".github/workflows/**"
      - "palantir*.py"
      - "zyra*.py"
      - "!docs/assets/**"
  pull_request:
    paths:
      - "scripts/generate_ecosystem_diagrams.py"
      - "scripts/generate_kraken_infra_diagram.py"
      - "docs/assets/**"
      - ".github/workflows/ecosystem-readme-refresh.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecosystem-diagrams-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate diagrams in the ephemeral CI workspace
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_SHA="$(git rev-parse HEAD)" python scripts/generate_ecosystem_diagrams.py
          GITHUB_SHA="$(git rev-parse HEAD)" python scripts/generate_kraken_infra_diagram.py
      - name: Surface generated changes without committing or pushing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ecosystem-diagrams
          if [[ -d docs/assets ]]; then
            cp -a docs/assets/. build/ecosystem-diagrams/
          fi
          {
            echo "## Review-generated ecosystem diagrams"
            echo
            echo "This workflow is intentionally read-only: it never resets, force-pushes, or commits to main."
            echo
            echo "Generated files (changed paths):"
            git status --short -- docs/assets || true
            echo
            echo "Review the artifact before including updated diagrams in a separately approved PR."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload diagram preview artifact for manual review
        uses: actions/upload-artifact@v4
        with:
          name: gpt-doug-ecosystem-diagrams-review
          path: build/ecosystem-diagrams/
          if-no-files-found: warn
          retention-days: 14
