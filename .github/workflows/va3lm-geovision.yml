name: VA3LM GeoVision

on:
  push:
    branches:
      - feature/va3lm-geovision
      - main
    paths:
      - 'agents/va3lm_geovision.py'
      - 'tests/test_va3lm_geovision.py'
      - '.github/workflows/va3lm-geovision.yml'
  pull_request:
    paths:
      - 'agents/va3lm_geovision.py'
      - 'tests/test_va3lm_geovision.py'
      - '.github/workflows/va3lm-geovision.yml'

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_va3lm_geovision.py
      - run: python -m compileall -q agents/va3lm_geovision.py
