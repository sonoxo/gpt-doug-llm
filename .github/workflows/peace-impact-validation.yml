name: GPT-Doug PeaceLab evidence and safety tests
on:
  pull_request:
    paths:
      - "peace_impact/**"
      - "tests/test_peace_impact.py"
      - "docs/GPT_DOUG_PEACELAB.md"
      - "run-GPT-Doug-PeaceLab.command"
      - "scripts/doug-max"
      - ".github/workflows/peace-impact-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-evidence-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run privacy, spoofing and certificate tests
        run: python3 -m unittest discover -s tests -p 'test_peace_impact.py' -v
      - name: Reproduce synthetic report without network access
        run: |
          bash run-GPT-Doug-PeaceLab.command demo > /tmp/peace-synthetic.json
          bash run-GPT-Doug-PeaceLab.command verify /tmp/peace-synthetic.json
          bash run-GPT-Doug-PeaceLab.command brief /tmp/peace-synthetic.json > /tmp/peace-brief.md
          grep -F 'UNSUBMITTED' /tmp/peace-brief.md
