name: Astral Grid v2

on:
  push:
    paths:
      - "astral/**"
      - ".github/workflows/astral-grid-v2.yml"
  pull_request:
    paths:
      - "astral/**"
      - ".github/workflows/astral-grid-v2.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Astral Grid
        run: python -m py_compile astral/grid.py astral/test_grid.py

      - name: Validate contract JSON
        run: python -m json.tool astral/xunia-grid.json >/dev/null

      - name: Run Astral Grid tests
        run: python astral/test_grid.py -v

      - name: Truth-boundary gate
        run: |
          grep -q "software orchestration architecture" astral/xunia-grid.json
          grep -q "does not expose autonomous real-world actuation" astral/README.md
