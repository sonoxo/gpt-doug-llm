name: GPT Doug Automated Agent Fleet

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      agent:
        description: "Which agent to run (all, sentinel, reviewer, emergency, marketplace)"
        required: false
        default: "all"
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  release:
    types: [published]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read
  security-events: write
  checks: write
  statuses: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install pytest pytest-cov ruff cryptography
      - name: Run core tests
        run: python3 -m pytest tests/ -v --tb=short --cov=. --cov-report=xml
      - name: Run hackathon agent tests
        run: |
          cd hackathon/tests && python3 -m pytest test_hackathon_agents.py -v --tb=short -c /dev/null
      - name: Run Google integration tests
        run: |
          cd google/tests && python3 -m pytest test_google_integration.py -v --tb=short -c /dev/null
      - name: Run zyra_guard regression suite
        run: python3 tests/test_zyra_guard.py
      - name: Lint
        run: ruff check . --output-format=github || true
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml

  sentinel-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: pip install pytest
      - name: Run Sentinel internal scan
        run: |
          python3 -c "
          import sys, json
          sys.path.insert(0, '.')
          from golden_shield import ZyraSentinel
          sentinel = ZyraSentinel()
          report = sentinel.full_sweep()
          print(json.dumps({
              'scan_id': report.scan_id,
              'total_findings': report.total_findings,
              'critical': report.critical_count,
              'planetary': report.planetary_count,
              'duration': round(report.duration_seconds, 2)
          }, indent=2))
          "
      - name: Run external threat intel scan
        run: |
          python3 -c "
          import sys, json
          sys.path.insert(0, '.')
          from golden_shield import ZyraSentinel
          sentinel = ZyraSentinel()
          findings = sentinel.scan_external()
          print(f'External findings: {len(findings)}')
          for f in findings[:5]:
              print(f'  [{f.severity}] {f.category}: {f.description[:60]}')
          "
      - name: Open issue if critical findings
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Sentinel Scan: Critical Findings Detected',
              body: 'Automated Sentinel scan detected critical security findings. Review the workflow logs.',
              labels: ['security', 'sentinel', 'automated']
            })

  auto-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pytest
      - name: Get PR diff
        run: git diff "origin/${{ github.base_ref }}...HEAD" -- . > /tmp/pr.diff
      - name: Run Doug Code Reviewer
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          python3 - <<'PY' || true
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, ".")
          from hackathon.agents.code_reviewer import review_pr

          result = review_pr({
              "number": int(os.environ["PR_NUMBER"]),
              "title": os.environ.get("PR_TITLE", ""),
              "body": os.environ.get("PR_BODY", ""),
              "diff": Path("/tmp/pr.diff").read_text(encoding="utf-8"),
              "files": [],
              "author": os.environ.get("PR_AUTHOR", ""),
          })
          print(json.dumps(result, indent=2))
          Path("review_comment.md").write_text(result["comment"], encoding="utf-8")
          PY
      - name: Post review comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '## 🔒 Automated Doug Code Review\n\nReview could not be generated.';
            try {
              comment = fs.readFileSync('review_comment.md', 'utf8');
            } catch (e) {}
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.pull_request.number }},
              body: comment
            });

  triage:
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' && github.event.action == 'opened'
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title.toLowerCase();
            const body = (context.payload.issue.body || '').toLowerCase();
            const text = title + ' ' + body;
            const labels = [];
            if (text.includes('security') || text.includes('zyra') || text.includes('vulnerability')) labels.push('security');
            if (text.includes('agent') || text.includes('sentinel') || text.includes('shield')) labels.push('agents');
            if (text.includes('bug') || text.includes('error') || text.includes('crash')) labels.push('bug');
            if (text.includes('feature') || text.includes('request') || text.includes('add')) labels.push('enhancement');
            if (text.includes('test') || text.includes('coverage')) labels.push('testing');
            if (text.includes('doc') || text.includes('readme')) labels.push('documentation');
            if (text.includes('google') || text.includes('gemini') || text.includes('cloud run')) labels.push('google-hackathon');
            if (text.includes('hackathon') || text.includes('devpost')) labels.push('hackathon');
            if (text.includes('crypto') || text.includes('blockchain') || text.includes('payment')) labels.push('crypto');
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: labels
              });
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: 'EUREKA // Thanks for opening this issue. GPT Doug has auto-labeled it and a maintainer will review soon.\n\n🛰️ This response was generated by the automated agent fleet.'
            });

  knowledge-sync:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Count knowledge entries
        run: |
          echo "## 📚 Knowledge Base Status" > knowledge_report.md
          echo "" >> knowledge_report.md
          echo "| File | Entries |" >> knowledge_report.md
          echo "|---|---|" >> knowledge_report.md
          for f in workers/knowledge/*.jsonl; do
            count=$(grep -c '"id"' "$f")
            echo "| $(basename $f) | $count |" >> knowledge_report.md
          done
          total=$(cat workers/knowledge/*.jsonl | grep -c '"id"')
          echo "| **TOTAL** | **$total** |" >> knowledge_report.md
          cat knowledge_report.md
      - name: Upload knowledge report
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-status
          path: knowledge_report.md

  crypto-anchor:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Generate Merkle root anchor
        run: |
          python3 -c "
          import sys, json
          sys.path.insert(0, '.')
          from crypto.blockchain_audit import BlockchainAuditChain
          chain = BlockchainAuditChain()
          anchor = chain.create_anchor('btc')
          print(json.dumps(anchor, indent=2))
          "

  marketplace-report:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Generate revenue report
        run: |
          python3 -c "
          import sys, json
          sys.path.insert(0, '.')
          from marketplace.store import AgentMarketplace
          mp = AgentMarketplace()
          agents = mp.list_agents()
          print('## 💰 Agent Marketplace Report')
          print(f'Total agents: {len(agents)}')
          print(f'Total installs: {sum(a[\"installs\"] for a in agents)}')
          for a in agents:
              print(f'  {a[\"name\"]}: {a[\"installs\"]} installs @ \${a[\"price_usd\"]}')
          rev = mp.revenue_report('sonoxo')
          print(f'Revenue: \${rev[\"revenue_usd\"]}')
          "

  deploy-cloud-run:
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.agent == 'deploy')
    permissions:
      contents: read
    env:
      GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
        continue-on-error: true
      - name: Build and deploy to Cloud Run
        if: env.GCP_PROJECT != ''
        run: |
          gcloud builds submit --tag gcr.io/$GCP_PROJECT/gpt-doug-api
          gcloud run deploy gpt-doug-api \
            --image gcr.io/$GCP_PROJECT/gpt-doug-api \
            --region us-central1 \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars GEMINI_API_KEY=$GEMINI_API_KEY
        continue-on-error: true
      - name: Cloud Run not configured
        if: env.GCP_PROJECT == ''
        run: |
          echo "⚠️ GCP_PROJECT_ID secret not set. Deployment skipped."
          echo "To enable: Add GCP_PROJECT_ID, GCP_SA_KEY, GEMINI_API_KEY to repo secrets"

  social-post:
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: read
    steps:
      - name: Generate social post
        run: |
          echo "🛰️ GPT Doug LLM v${{ github.event.release.tag_name }} is LIVE!" > social.txt
          echo "" >> social.txt
          echo "✅ Zyra 3.0 cybersecurity watchdog" >> social.txt
          echo "✅ Golden Shield perimeter defense" >> social.txt
          echo "✅ Sentinel 24/7 threat scanner" >> social.txt
          echo "✅ 10 autonomous agents" >> social.txt
          echo "✅ Google Cloud + Gemini integration" >> social.txt
          echo "✅ Crypto payment SDK + blockchain audit" >> social.txt
          echo "✅ Automated regression suite" >> social.txt
          echo "" >> social.txt
          echo "https://github.com/sonoxo/gpt-doug-llm" >> social.txt
          echo "" >> social.txt
          echo "#AllThingsAgenticHackathon #AI #Cybersecurity #OpenSource" >> social.txt
          cat social.txt
      - name: Upload social post
        uses: actions/upload-artifact@v4
        with:
          name: social-post
          path: social.txt

  stats-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate project stats
        run: |
          FILES=$(git ls-files | wc -l)
          LINES=$(git ls-files | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}')
          COMMITS=$(git log --oneline | wc -l)
          TESTS=$(find . -name "test_*.py" | wc -l)
          KNOWLEDGE=$(cat workers/knowledge/*.jsonl 2>/dev/null | grep -c '"id"' || echo 0)
          AGENTS=$(find hackathon/agents/ -name "*.py" ! -name "__init__.py" | wc -l)
          cat > stats.json << STATS
          {
            "files": $FILES,
            "lines": $LINES,
            "commits": $COMMITS,
            "test_files": $TESTS,
            "knowledge_entries": $KNOWLEDGE,
            "agents": $AGENTS,
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          STATS
          cat stats.json
      - name: Upload stats
        uses: actions/upload-artifact@v4
        with:
          name: project-stats
          path: stats.json
