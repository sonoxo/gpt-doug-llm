name: White House Daily → The Black House

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: white-house-daily
  cancel-in-progress: false

jobs:
  collect-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install collector dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.12.3

      - name: Collect first-party White House publications
        run: python scripts/white_house_daily.py

      - name: Validate generated JSON
        run: |
          python -m json.tool intel/white-house/state.json >/dev/null
          latest_json=$(find intel/white-house/daily -name '*.json' -type f | sort | tail -n 1)
          test -n "$latest_json"
          python -m json.tool "$latest_json" >/dev/null

      - name: Commit daily source watch
        run: |
          git config user.name 'theblackhouse-bot'
          git config user.email 'theblackhouse-bot@users.noreply.github.com'
          git add intel/white-house
          if git diff --cached --quiet; then
            echo 'No repository changes.'
            exit 0
          fi
          git commit -m "intel(white-house): daily first-party source watch $(date -u +%F)"
          git push

      - name: Workflow statement
        if: always()
        run: |
          echo 'Official White House source statements are preserved as source claims, not treated as independent verification.'
          echo 'This independent open-source workflow does not imply White House or U.S. Government affiliation or endorsement.'
