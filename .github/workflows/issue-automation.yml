name: Issue automation

on:
  issues:
    types: [opened, labeled, closed]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, closed, synchronize]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  label-and-triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Auto-label issues
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue?.title || context.payload.pull_request?.title || "";
            const body = context.payload.issue?.body || context.payload.pull_request?.body || "";
            const text = (title + " " + body).toLowerCase();
            const labels = [];
            if (text.includes("zyra") || text.includes("security") || text.includes("guard")) labels.push("security");
            if (text.includes("agent") || text.includes("chain") || text.includes("daemon")) labels.push("agents");
            if (text.includes("web") || text.includes("server") || text.includes("frontend")) labels.push("web");
            if (text.includes("worker") || text.includes("xqe") || text.includes("ontology")) labels.push("workers");
            if (text.includes("bug") || text.includes("crash") || text.includes("error")) labels.push("bug");
            if (text.includes("feature") || text.includes("request") || text.includes("add")) labels.push("enhancement");
            if (text.includes("test") || text.includes("coverage")) labels.push("testing");
            if (text.includes("docs") || text.includes("readme")) labels.push("documentation");
            if (labels.length > 0 && context.payload.issue) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: labels
              });
            }

      - name: Comment on first-time issues
        if: github.event_name == 'issues' && github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: "EUREKA // Thanks for opening this issue. GPT Doug will review it. A maintainer will respond soon."
            });
