name: Shaggoth Swarm CI

on:
  push:
    paths:
      - "shaggoth-swarm-gpt100/**"
      - ".github/workflows/shaggoth-swarm-ci.yml"
  pull_request:
    paths:
      - "shaggoth-swarm-gpt100/**"
      - ".github/workflows/shaggoth-swarm-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shaggoth-swarm-gpt100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: shaggoth layers --validate
      - run: shaggoth heartbeat
      - run: shaggoth heartbeat --json

  infrastructure:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shaggoth-swarm-gpt100
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose -f infra/compose/compose.yml config --quiet
      - name: Build production image
        run: docker build -t shaggoth-swarm-gpt100:ci .
      - name: Start API container
        run: docker run -d --name shaggoth-ci -p 127.0.0.1:8787:8787 shaggoth-swarm-gpt100:ci
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs shaggoth-ci
          exit 1
      - name: Verify readiness and capabilities
        run: |
          curl -fsS http://127.0.0.1:8787/ready
          curl -fsS http://127.0.0.1:8787/capabilities
          curl -fsS http://127.0.0.1:8787/layers
          curl -fsS http://127.0.0.1:8787/visual/data
          curl -fsS http://127.0.0.1:8787/visual | grep -q 'SHAGGOTH // VISUAL DATA LAYERS'
      - name: Cleanup
        if: always()
        run: docker rm -f shaggoth-ci || true
