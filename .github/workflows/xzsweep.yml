name: XZSWEEP 24h Maintainer

on:
  push:
    branches: [main]
    paths-ignore:
      - ".xzsweep/**"
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

# Singularity law: OBSERVE -> PROPOSE -> TEST -> HUMAN APPROVAL.
# A scheduled agent never commits or pushes fixes to main.
permissions:
  contents: read

concurrency:
  group: xzsweep-main
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout history for accurate freshness evidence
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assess repository freshness without changing source files
        run: python scripts/xzsweep.py --hours 24 --report .xzsweep/freshness.json
      - name: Verify report contract and that tracked files are unchanged
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('.xzsweep/freshness.json').read_text())
          assert p["schema"] == "xzsweep.freshness.v1"
          assert p["mode"] == "check"
          assert p["content_repairs"] == 0
          assert p["tracked_files_reviewed"] > 0
          print("Read-only sweep:",p["due_files_reviewed"],"due paths,",p["validation_issue_files"],"validation finding files")
          PY
          git diff --exit-code -- . ':!.xzsweep/freshness.json'
          git diff --cached --exit-code
      - name: Publish governed maintenance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xzsweep-read-only-freshness
          path: .xzsweep/freshness.json
          if-no-files-found: error
          retention-days: 14
      - name: Human review summary
        if: success()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p=json.loads(Path('.xzsweep/freshness.json').read_text())
          print("## XZSWEEP — governed, read-only")
          print()
          print(f"- Tracked files reviewed: **{p['tracked_files_reviewed']}**")
          print(f"- Due paths: **{p['due_files_reviewed']}**")
          print(f"- Validation finding files: **{p['validation_issue_files']}**")
          print("- Source changes pushed: **0**")
          print("- Next step: inspect the artifact and authorize a separately reviewed PR if repairs are necessary.")
          PY
