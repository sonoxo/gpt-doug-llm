name: Temporary Ruff import diagnostic
on:
  pull_request:
    paths:
      - "gpt_brain/framework_health.py"
      - ".github/workflows/ruff-import-probe.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - name: Print exact import formatting diff
        run: ruff check --fix --diff gpt_brain/framework_health.py || true
