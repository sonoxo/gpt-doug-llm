name: XUNIA Platform CI

on:
  pull_request:
    paths:
      - 'xunia-platform/**'
      - '.github/workflows/xunia-platform.yml'
  push:
    branches:
      - feature/xunia-ontology-platform
      - feature/xunia-sovereignty
    paths:
      - 'xunia-platform/**'
      - '.github/workflows/xunia-platform.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xunia-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm run test
      - name: Authenticated persistence smoke test
        env:
          XUNIA_PLATFORM_HOST: 127.0.0.1
          XUNIA_PLATFORM_PORT: 4400
          XUNIA_DATA_DIR: /tmp/xunia-platform-state
          XUNIA_AUTH_REQUIRED: '1'
          XUNIA_API_KEYS: '{"ci-admin-token":{"role":"admin","subject":"ci-admin"},"ci-operator-token":{"role":"operator","subject":"ci-operator"},"ci-viewer-token":{"role":"viewer","subject":"ci-viewer"}}'
        run: |
          rm -rf "$XUNIA_DATA_DIR"
          node dist/src/server.js > /tmp/xunia-platform.log 2>&1 &
          PID=$!
          cleanup() { kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4400/ready >/tmp/ready.json; then break; fi
            sleep 1
          done
          cat /tmp/ready.json
          node -e "const x=require('/tmp/ready.json'); if(!x.ok) process.exit(1)"
          test "$(curl -sS -o /tmp/unauth.json -w '%{http_code}' http://127.0.0.1:4400/api/ontology)" = 401
          curl -fsS -H 'Authorization: Bearer ci-viewer-token' http://127.0.0.1:4400/api/ontology >/tmp/ontology.json
          curl -fsS -X POST -H 'Authorization: Bearer ci-admin-token' -H 'Content-Type: application/json' \
            -d '{"id":"site:ci","type":"Site","properties":{"source":"ci"}}' \
            http://127.0.0.1:4400/api/ontology/objects >/tmp/create.json
          curl -fsS -X POST -H 'Authorization: Bearer ci-operator-token' -H 'Content-Type: application/json' \
            -d '{"agentId":"xunia-analyst","message":"Analyze site:ci"}' \
            http://127.0.0.1:4400/api/aip/run >/tmp/run.json
          curl -fsS -H 'Authorization: Bearer ci-viewer-token' http://127.0.0.1:4400/api/aip/audit/verify >/tmp/audit.json
          node -e "const x=require('/tmp/audit.json'); if(!x.ok) process.exit(1)"
          cleanup
          trap - EXIT

          node dist/src/server.js > /tmp/xunia-platform-restart.log 2>&1 &
          PID=$!
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4400/ready >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS -H 'Authorization: Bearer ci-viewer-token' http://127.0.0.1:4400/api/ontology/objects/site%3Aci | grep -q 'site:ci'
      - name: Sovereign encrypted-state smoke test
        env:
          XUNIA_PLATFORM_HOST: 127.0.0.1
          XUNIA_PLATFORM_PORT: 4401
          XUNIA_DATA_DIR: /tmp/xunia-sovereign-state
          XUNIA_AUTH_REQUIRED: '1'
          XUNIA_SOVEREIGNTY_ENFORCED: '1'
          XUNIA_REALM_ID: xunia-ci-realm
          XUNIA_REGION: us-va-ci
          XUNIA_ALLOWED_REGIONS: us-va-ci
          XUNIA_KEY_AUTHORITY: customer
          XUNIA_CUSTOMER_KEY_ID: kms://ci/xunia
          XUNIA_REQUIRE_ENCRYPTED_STATE: '1'
          XUNIA_STATE_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          XUNIA_API_KEYS: '{"sovereign-admin":{"role":"admin","subject":"ci-admin","realm":"xunia-ci-realm"},"sovereign-viewer":{"role":"viewer","subject":"ci-viewer","realm":"xunia-ci-realm"}}'
        run: |
          rm -rf "$XUNIA_DATA_DIR"
          node dist/src/server.js > /tmp/xunia-sovereign.log 2>&1 &
          PID=$!
          cleanup() { kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4401/ready >/tmp/sovereign-ready.json; then break; fi
            sleep 1
          done
          cat /tmp/sovereign-ready.json
          node -e "const x=require('/tmp/sovereign-ready.json'); if(!x.ok || !x.auth.sovereignty.ready) process.exit(1)"
          curl -fsS -X POST -H 'Authorization: Bearer sovereign-admin' -H 'X-Xunia-Realm: xunia-ci-realm' -H 'X-Xunia-Region: us-va-ci' -H 'Content-Type: application/json' \
            -d '{"id":"site:sovereign","type":"Site","properties":{"realm":"xunia-ci-realm"}}' \
            http://127.0.0.1:4401/api/ontology/objects >/tmp/sovereign-create.json
          test "$(curl -sS -o /tmp/cross-realm.json -w '%{http_code}' -H 'Authorization: Bearer sovereign-viewer' -H 'X-Xunia-Realm: other-realm' http://127.0.0.1:4401/api/ontology)" = 401
          grep -q 'encrypted-state-v1' "$XUNIA_DATA_DIR/ontology.json"
          if grep -q 'site:sovereign' "$XUNIA_DATA_DIR/ontology.json"; then exit 1; fi
      - name: Build production image
        run: docker build -t xunia-platform:ci .
