name: Sonoxo S-Brain focused tests

on:
  push:
    paths:
      - 'gpt_brain/s_brain.py'
      - 'gpt_brain/s_brain_cli.py'
      - 'tests/test_s_brain.py'
      - '.github/workflows/sonoxo-s-brain.yml'
  pull_request:
    paths:
      - 'gpt_brain/s_brain.py'
      - 'gpt_brain/s_brain_cli.py'
      - 'tests/test_s_brain.py'
      - '.github/workflows/sonoxo-s-brain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install model-only test dependencies
        run: |
          python -m pip install --disable-pip-version-check 'torch>=2.1,<3' 'safetensors>=0.4,<1' 'numpy>=1.26,<3'
      - name: Compile Python source
        run: |
          python -m py_compile gpt_brain/s_brain.py gpt_brain/s_brain_cli.py tests/test_s_brain.py
      - name: Run S-Brain test suite (real model training and checkpoint inference)
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python -m unittest tests.test_s_brain -v
      - name: Offline CLI health smoke test
        env:
          PYTHONPATH: .
        run: python -m gpt_brain.s_brain_cli --db "${RUNNER_TEMP}/s-brain.sqlite3" status
