name: GPT-Almighty-Sonoxo real MLM tests

on:
  push:
    paths:
      - "gpt_doug_mlm/almighty_sonoxo.py"
      - "gpt_doug_mlm/almighty_cli.py"
      - "gpt_doug_mlm/almighty_ensemble.py"
      - "tests/test_almighty_ensemble.py"
      - "tests/test_almighty_sonoxo.py"
      - "data/almighty_sonoxo_seed.txt"
      - ".github/workflows/almighty-sonoxo-mlm.yml"
  pull_request:
    paths:
      - "gpt_doug_mlm/almighty_sonoxo.py"
      - "gpt_doug_mlm/almighty_cli.py"
      - "gpt_doug_mlm/almighty_ensemble.py"
      - "tests/test_almighty_ensemble.py"
      - "tests/test_almighty_sonoxo.py"
      - "data/almighty_sonoxo_seed.txt"
      - ".github/workflows/almighty-sonoxo-mlm.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-infer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install model-only dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check "torch>=2.1,<3" "safetensors>=0.4,<1" "numpy>=1.26,<3"
      - name: Unit tests (real gradient training and weight serialization)
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          PYTHONPATH: .
        run: python -m unittest tests.test_almighty_sonoxo tests.test_almighty_ensemble -v
      - name: CLI end-to-end train, inspect and inference
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          PYTHONPATH: .
        run: |
          python -m gpt_doug_mlm.almighty_cli train --corpus data/almighty_sonoxo_seed.txt --output "${RUNNER_TEMP}/sonoxo-model" --epochs 2 --dimension 32 --heads 4 --layers 1
          python -m gpt_doug_mlm.almighty_cli inspect --model "${RUNNER_TEMP}/sonoxo-model"
          python -m gpt_doug_mlm.almighty_cli fill-mask --model "${RUNNER_TEMP}/sonoxo-model" --text 'the ontology stores [MASK] with provenance' --top-k 3
