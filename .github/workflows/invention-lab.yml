name: Invention Lab
on:
  push:
    paths: ['research_lab/**', 'scripts/invention_lab.py', 'scripts/doug-max', '.github/workflows/invention-lab.yml']
  pull_request:
    paths: ['research_lab/**', 'scripts/invention_lab.py', 'scripts/doug-max', '.github/workflows/invention-lab.yml']
permissions:
  contents: read
jobs:
  prototypes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m unittest discover -s research_lab/tests -v
      - run: bash scripts/doug-max invention-lab demo
