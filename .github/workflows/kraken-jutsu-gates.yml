name: Kraken Jutsu Gates

on:
  pull_request:
    paths:
      - 'kraken_jutsu/**'
      - '.github/workflows/kraken-jutsu-gates.yml'
  push:
    branches: [main]
    paths:
      - 'kraken_jutsu/**'
      - '.github/workflows/kraken-jutsu-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate-a-usb-blackhouse:
    name: Gate A - USB + Black House
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Execute USB and friend lifecycle gates
        run: |
          python -m pytest -q \
            kraken_jutsu/test_live.py \
            kraken_jutsu/test_acceptance_v031.py

  gate-b-live-ontology:
    name: Gate B - Live Data + Ontology
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify live CISA KEV ingestion
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from kraken_jutsu.live import CISAKEVSource, LiveRuntime

          with tempfile.TemporaryDirectory() as tmp:
              runtime = LiveRuntime(Path(tmp) / 'state')
              payload = CISAKEVSource().fetch(timeout=30)
              rows = payload.get('vulnerabilities', [])
              assert rows, 'CISA KEV returned no vulnerability records'
              count = runtime.ingest_kev()
              assert count > 0, 'Kraken ingested zero CISA KEV records'
              assert runtime.readiness()['gate_b_live_ontology'] is True
              print(f'LIVE_GATE_OK count={count} source={payload.get("_kraken_source_url")}')
          PY

  kraken-ready-contract:
    name: Kraken Ready Contract
    needs: [gate-a-usb-blackhouse, gate-b-live-ontology]
    runs-on: ubuntu-latest
    steps:
      - run: echo '✅ Gate A + Gate B passed. Kraken contract is green.'
