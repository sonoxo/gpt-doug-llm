name: GPT-Delta Adapter and Ontology Gates

on:
  push:
    paths:
      - "gpt_doug_mlm/delta*.py"
      - "tests/test_delta.py"
      - ".github/workflows/gpt-delta.yml"
  pull_request:
    paths:
      - "gpt_doug_mlm/delta*.py"
      - "tests/test_delta.py"
      - ".github/workflows/gpt-delta.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local ML dependencies
        run: python -m pip install --disable-pip-version-check "torch>=2.1,<3" "numpy>=1.26,<3" "safetensors>=0.4,<1"
      - name: Test real frozen-base adaptation and evidence gates
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          PYTHONPATH: .
        run: python -m unittest tests.test_delta -v
      - name: Inspect CLI without downloading any models
        env:
          PYTHONPATH: .
        run: python -m gpt_doug_mlm.delta_cli --help
