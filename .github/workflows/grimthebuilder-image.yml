name: GrimTheBuilder Integration Artifact Container Publish

on:
  push:
    branches: [main]
    paths:
      - 'grimthebuilder-app/**'
      - '.github/workflows/grimthebuilder-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: grimthebuilder-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/grimthebuilder
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ./grimthebuilder-app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull published integration artifact image back from GHCR
        run: |
          docker image rm ghcr.io/${{ github.repository_owner }}/grimthebuilder:latest || true
          docker pull ghcr.io/${{ github.repository_owner }}/grimthebuilder:latest
          docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/${{ github.repository_owner }}/grimthebuilder:latest | tee /tmp/grim-image-digest.txt

      - name: Boot integration artifact image and verify health
        run: |
          docker run -d --name grimthebuilder-verify -p 8787:8787 \
            -e HOST=0.0.0.0 \
            -e PORT=8787 \
            -e GRIM_DATA_DIR=/tmp/grim-data \
            ghcr.io/${{ github.repository_owner }}/grimthebuilder:latest
          ok=0
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error --connect-timeout 1 --max-time 2 \
              --output /tmp/grim-health.json http://127.0.0.1:8787/api/health; then
              cat /tmp/grim-health.json
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            docker inspect grimthebuilder-verify || true
            docker logs grimthebuilder-verify || true
            exit 1
          fi
          grep -q '"schema":"GRIM_RUNTIME_V1"' /tmp/grim-health.json
          grep -q '"status":"ok"' /tmp/grim-health.json
          curl --fail --silent --show-error --output /tmp/grim-capabilities.json http://127.0.0.1:8787/api/capabilities
          cat /tmp/grim-capabilities.json
          grep -q '"music-generator-v1"' /tmp/grim-capabilities.json
          echo
          echo "VERIFIED_IMAGE=$(cat /tmp/grim-image-digest.txt)"
          echo "VERIFIED_HEALTH=$(cat /tmp/grim-health.json)"

      - name: Exercise published integration artifact with music-generator contract
        run: |
          CREATE=$(curl --fail --silent --show-error \
            -X POST http://127.0.0.1:8787/api/projects \
            -H 'content-type: application/json' \
            --data '{"name":"Published Image Music Generator","template":"static"}')
          PROJECT_ID=$(printf '%s' "$CREATE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["project"]["id"])')
          test -n "$PROJECT_ID"

          export GRIM_TEST_PROMPT='Build a fully functional browser music generator app with prompt-aware original beat generation, trap house ambient and synthwave styles, BPM and key controls, Web Audio synthesis, a sequencer, play and stop controls, browser recording, pattern export, responsive design, and no paid external API.'
          PAYLOAD=$(python3 -c 'import json,os; print(json.dumps({"prompt":os.environ["GRIM_TEST_PROMPT"],"mode":"build"}))')
          BUILD=$(curl --fail --silent --show-error \
            -X POST "http://127.0.0.1:8787/api/projects/$PROJECT_ID/agent" \
            -H 'content-type: application/json' \
            --data "$PAYLOAD")
          printf '%s\n' "$BUILD" | tee /tmp/grim-music-build.json
          grep -q '"provider":"local"' /tmp/grim-music-build.json
          grep -q '"blueprint":"music-generator-v1"' /tmp/grim-music-build.json

          curl --fail --silent --show-error "http://127.0.0.1:8787/preview/$PROJECT_ID/" | tee /tmp/grim-music-preview.html
          grep -q 'GrimBeat Generator' /tmp/grim-music-preview.html
          grep -q '>Generate<' /tmp/grim-music-preview.html
          grep -q '>● Record<' /tmp/grim-music-preview.html

          curl --fail --silent --show-error "http://127.0.0.1:8787/api/projects/$PROJECT_ID/file?path=script.js" | tee /tmp/grim-music-script.js
          node --check /tmp/grim-music-script.js
          grep -q 'AudioContext' /tmp/grim-music-script.js
          grep -q 'MediaRecorder' /tmp/grim-music-script.js
          grep -q 'downloadPattern' /tmp/grim-music-script.js

          echo "MUSIC_PROJECT_ID=$PROJECT_ID"
          echo 'PUBLISHED_IMAGE_MUSIC_BUILD=PASS'

      - name: Container verification logs
        if: always()
        run: |
          docker logs grimthebuilder-verify || true
          docker rm -f grimthebuilder-verify || true
