name: XUNIA COSMOS / Free Outer Space Ontology

on:
  pull_request:
    paths:
      - 'docs/cosmos/**'
      - 'docs/fusion/**'
      - 'docs/molecules/**'
      - 'docs/synapse/**'
      - 'docs/physarum/**'
      - 'docs/telemetry/**'
      - 'docs/index.html'
      - 'docs/cl1-live.js'
      - 'docs/cl1-live.css'
      - 'docs/biological-data-center/index.html'
      - 'docs/resources.json'
      - 'docs/docs-index.json'
      - 'scripts/xunia_cosmos_import.py'
      - 'scripts/xunia-cosmos'
      - 'tests/test_xunia_cosmos.py'
      - 'tests/test_xunia_cosmos_server.py'
      - 'scripts/xunia_cosmos_serve.py'
      - 'tests/xunia_cosmos_chrome_smoke.py'
      - 'tests/test_xunia_planet_clones.py'
      - 'tests/xunia_planets_chrome_smoke.py'
      - 'tests/test_xunia_xenology.py'
      - 'tests/test_xunia_live_core.py'
      - 'tests/test_xunia_fusion.py'
      - 'tests/test_xunia_molecules.py'
      - 'tests/xunia_molecules_chrome_smoke.py'
      - 'tests/test_xunia_synapse.py'
      - 'tests/xunia_synapse_chrome_smoke.py'
      - 'tests/test_xunia_physarum.py'
      - 'tests/xunia_physarum_model_smoke.js'
      - 'tests/xunia_physarum_chrome_smoke.py'
      - 'tests/test_xunia_telemetry.py'
      - 'tests/xunia_telemetry_model_smoke.js'
      - 'tests/xunia_telemetry_chrome_smoke.py'
      - 'gpt_brain/telemetry.py'
      - 'gpt_brain/physarum.py'
      - 'gpt_brain/kernel.py'
      - 'scripts/xunia_molecules_import.py'
      - 'tests/xunia_fusion_chrome_smoke.py'
      - 'tests/xunia_live_core_chrome_smoke.py'
      - 'tests/xunia_xenology_chrome_smoke.py'
      - '.github/workflows/xunia-cosmos.yml'
  push:
    branches: [main]
    paths:
      - 'docs/cosmos/**'
      - 'docs/fusion/**'
      - 'docs/molecules/**'
      - 'docs/synapse/**'
      - 'docs/physarum/**'
      - 'docs/telemetry/**'
      - 'scripts/xunia_cosmos_import.py'
      - 'scripts/xunia-cosmos'
      - 'tests/test_xunia_cosmos.py'
      - 'tests/test_xunia_cosmos_server.py'
      - 'scripts/xunia_cosmos_serve.py'
      - 'tests/xunia_cosmos_chrome_smoke.py'
      - 'tests/test_xunia_planet_clones.py'
      - 'tests/xunia_planets_chrome_smoke.py'
      - 'tests/test_xunia_xenology.py'
      - 'tests/test_xunia_live_core.py'
      - 'tests/test_xunia_fusion.py'
      - 'tests/test_xunia_molecules.py'
      - 'tests/xunia_molecules_chrome_smoke.py'
      - 'tests/test_xunia_synapse.py'
      - 'tests/xunia_synapse_chrome_smoke.py'
      - 'tests/test_xunia_physarum.py'
      - 'tests/xunia_physarum_model_smoke.js'
      - 'tests/xunia_physarum_chrome_smoke.py'
      - 'tests/test_xunia_telemetry.py'
      - 'tests/xunia_telemetry_model_smoke.js'
      - 'tests/xunia_telemetry_chrome_smoke.py'
      - 'gpt_brain/telemetry.py'
      - 'gpt_brain/physarum.py'
      - 'gpt_brain/kernel.py'
      - 'scripts/xunia_molecules_import.py'
      - 'tests/xunia_fusion_chrome_smoke.py'
      - 'tests/xunia_live_core_chrome_smoke.py'
      - 'tests/xunia_xenology_chrome_smoke.py'
      - '.github/workflows/xunia-cosmos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cosmos-free-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check code and ontology syntax
        run: |
          python -m json.tool docs/cosmos/catalogs/seed.json > /dev/null
          python -m json.tool docs/cosmos/planets/catalog.json > /dev/null
          python -m json.tool docs/cosmos/xenology/catalog.json > /dev/null
          python -m compileall -q scripts/xunia_cosmos_import.py scripts/xunia_cosmos_serve.py tests/test_xunia_cosmos_server.py tests/xunia_cosmos_chrome_smoke.py
          node --check docs/cosmos/cosmos.js
          node --check docs/cosmos/planets/planets.js
          node --check docs/cosmos/xenology/app.js
          node --check docs/cl1-live.js
          python -m json.tool docs/fusion/ontology.json > /dev/null
          node --check docs/fusion/fusion.js
          python -m json.tool docs/molecules/catalogs/seed.json > /dev/null
          python -m json.tool docs/molecules/catalogs/pubchem.json > /dev/null
          node --check docs/molecules/molecules.js
          node --check docs/synapse/synapse.js
          node --check docs/physarum/model.js
          node --check docs/physarum/forge.js
          node --check docs/telemetry/engine.js
          node --check docs/telemetry/atlas.js
          node --check tests/xunia_telemetry_model_smoke.js
          python -m json.tool docs/telemetry/registry.json > /dev/null
          python -m compileall -q tests/test_xunia_telemetry.py tests/xunia_telemetry_chrome_smoke.py gpt_brain/telemetry.py
          node --check tests/xunia_physarum_model_smoke.js
          python -m json.tool docs/physarum/ontology.json > /dev/null
          python -m compileall -q gpt_brain/physarum.py tests/test_xunia_physarum.py tests/xunia_physarum_chrome_smoke.py
          python -m compileall -q tests/test_xunia_synapse.py tests/xunia_synapse_chrome_smoke.py
          python -m compileall -q scripts/xunia_molecules_import.py tests/test_xunia_molecules.py tests/xunia_molecules_chrome_smoke.py
          python -m compileall -q tests/test_xunia_fusion.py tests/xunia_fusion_chrome_smoke.py
          python -m compileall -q tests/test_xunia_live_core.py tests/xunia_live_core_chrome_smoke.py
          bash -n scripts/xunia-cosmos
      - name: Verify safe localhost port fallback and COSMOS app routes
        run: python -m unittest discover -s tests -p 'test_xunia_cosmos_server.py' -v
      - name: Validate astronomy hierarchy and NASA/ESA importer offline
        run: python -m unittest discover -s tests -p 'test_xunia_cosmos.py' -v
      - name: Confirm real Chrome renders 55 curated nodes and 54 edges
        run: python tests/xunia_cosmos_chrome_smoke.py
      - name: Validate CL1 eight-planet physics catalogs and non-kinetic clone boundaries
        run: python -m unittest discover -s tests -p 'test_xunia_planet_clones.py' -v
      - name: Verify CL1 planet render and interactive clone lifecycle in real Chrome
        run: python tests/xunia_planets_chrome_smoke.py
      - name: Validate CL1 xenology source classifications and data boundaries
        run: python -m unittest discover -s tests -p 'test_xunia_xenology.py' -v
      - name: Verify real Xenology browser cards and Shaggoth viewer interactions
        run: python tests/xunia_xenology_chrome_smoke.py
      - name: Verify XUNIA HQ living core eight-portals accessibility and local-only design
        run: python -m unittest discover -s tests -p 'test_xunia_live_core.py' -v
      - name: Verify live CL1 homepage organism and reduced motion in Chromium
        run: python tests/xunia_live_core_chrome_smoke.py
      - name: Validate source-qualified NASA/cloud/ops/ontology Fusion schema and links
        run: python -m unittest discover -s tests -p 'test_xunia_fusion.py' -v
      - name: Test real interactive Fusion browser and local source provenance
        run: python tests/xunia_fusion_chrome_smoke.py
      - name: Validate CL1 chemistry, atom-bond ontology and PubChem parser offline
        run: python -m unittest discover -s tests -p 'test_xunia_molecules.py' -v
      - name: Verify interactive molecular atom viewer and provenance in Chromium
        run: python tests/xunia_molecules_chrome_smoke.py
      - name: Validate CL1 five-channel sensory ontology and hardware safety boundaries
        run: python -m unittest discover -s tests -p 'test_xunia_synapse.py' -v
      - name: Verify actual CL1 neural interface and reduced-motion controls in Chromium
        run: python tests/xunia_synapse_chrome_smoke.py
      - name: Validate Physarum source ontology and GPT-Doug brain retrieval
        run: python -m unittest discover -s tests -p 'test_xunia_physarum.py' -v
      - name: Verify real Tero-inspired flow adaptation and printable SVG via Node
        run: node tests/xunia_physarum_model_smoke.js
      - name: Verify real Physarum Forge browser edits and reduced-motion via Chromium
        run: python tests/xunia_physarum_chrome_smoke.py
      - name: Validate typed linear and kinetic telemetry ontology and free-only runtime
        run: python -m unittest discover -s tests -p 'test_xunia_telemetry.py' -v
      - name: Validate numerical trace capture, signed kinetic vectors and deterministic JSON CSV exports
        run: node tests/xunia_telemetry_model_smoke.js
      - name: Validate interactive telemetry dashboard in Chromium with reduced motion
        run: python tests/xunia_telemetry_chrome_smoke.py
      - name: Validate public XUNIA and CL1 entry points
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          docs=Path("docs")
          assert (docs/"CNAME").read_text().strip()=="xunia.org"
          assert "./cosmos/" in (docs/"index.html").read_text()
          assert "../cosmos/" in (docs/"biological-data-center/index.html").read_text()
          assert "./cosmos/" in (docs/"documentation.html").read_text()
          registry=json.loads((docs/"resources.json").read_text())
          matches=[x for x in registry["items"] if x["id"]=="xunia-cosmos-space-ontology"]
          assert len(matches)==1 and matches[0]["free"] and matches[0]["interactive"]
          assert matches[0]["url"]=="./cosmos/"
          idx=json.loads((docs/"docs-index.json").read_text())
          assert idx["publicSurfaces"]["cosmos"]=="https://xunia.org/cosmos/"
          assert idx["publicSurfaces"]["planetaryForge"]=="https://xunia.org/cosmos/planets/"
          assert idx["publicSurfaces"]["xenologyUapShaggoth"]=="https://xunia.org/cosmos/xenology/"
          assert "./xenology/" in (docs/"cosmos/index.html").read_text()
          assert "./cosmos/xenology/" in (docs/"index.html").read_text()
          assert "../cosmos/xenology/" in (docs/"biological-data-center/index.html").read_text()
          archive=json.loads((docs/"cosmos/xenology/catalog.json").read_text())
          assert len(archive["records"])==36
          assert "./cosmos/planets/" in (docs/"index.html").read_text()
          assert "../cosmos/planets/" in (docs/"biological-data-center/index.html").read_text()
          planets=json.loads((docs/"cosmos/planets/catalog.json").read_text())
          assert len(planets["planets"])==8
          fusion=json.loads((docs/"fusion/ontology.json").read_text())
          assert fusion["schema"]=="xunia.cl1.fusion-ontology.v1"
          assert "./fusion/" in (docs/"index.html").read_text()
          assert "../fusion/" in (docs/"cosmos/index.html").read_text()
          assert "../fusion/" in (docs/"biological-data-center/index.html").read_text()
          assert idx["publicSurfaces"]["fusionAtlas"]=="https://xunia.org/fusion/"
          molecules=json.loads((docs/"molecules/catalogs/seed.json").read_text())
          assert len(molecules["molecules"])==33
          assert "./molecules/" in (docs/"index.html").read_text()
          assert "../molecules/" in (docs/"fusion/index.html").read_text()
          assert "../molecules/" in (docs/"cosmos/index.html").read_text()
          assert "../molecules/" in (docs/"biological-data-center/index.html").read_text()
          assert idx["publicSurfaces"]["molecularObservatory"]=="https://xunia.org/molecules/"
          assert "./synapse/" in (docs/"index.html").read_text()
          assert "../synapse/" in (docs/"fusion/index.html").read_text()
          assert "../synapse/" in (docs/"biological-data-center/index.html").read_text()
          assert idx["publicSurfaces"]["sensorySynapse"]=="https://xunia.org/synapse/"
          assert "./physarum/" in (docs/"index.html").read_text()
          assert "../physarum/" in (docs/"synapse/index.html").read_text()
          assert "../physarum/" in (docs/"fusion/index.html").read_text()
          assert "../physarum/" in (docs/"biological-data-center/index.html").read_text()
          assert idx["publicSurfaces"]["physarumForge"]=="https://xunia.org/physarum/"
          assert "./telemetry/" in (docs/"index.html").read_text()
          assert "../telemetry/" in (docs/"physarum/index.html").read_text()
          assert "../telemetry/" in (docs/"synapse/index.html").read_text()
          assert "../telemetry/" in (docs/"fusion/index.html").read_text()
          assert "../telemetry/" in (docs/"biological-data-center/index.html").read_text()
          assert idx["publicSurfaces"]["telemetryAtlas"]=="https://xunia.org/telemetry/"
          assert (docs/"telemetry/registry.json").exists()
          assert (docs/"physarum/ontology.json").exists()
          assert (docs/"synapse/index.html").exists()
          print("COSMOS GitHub Pages contract passed; no Vercel or paid APIs")
          PY
