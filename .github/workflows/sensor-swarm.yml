name: Governed Sensor Swarm
on:
  push:
    paths:
      - 'sensor_swarm/**'
      - 'tests/test_sensor_swarm.py'
      - 'docs/sensor-policy.json'
      - '.github/workflows/sensor-swarm.yml'
  pull_request:
    paths:
      - 'sensor_swarm/**'
      - 'tests/test_sensor_swarm.py'
      - 'docs/sensor-policy.json'
      - '.github/workflows/sensor-swarm.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -p 'test_sensor_swarm.py' -v
      - run: python -m unittest discover -s tests -p 'test_biopineal_phase2.py' -v
      - run: python -m sensor_swarm demo > /tmp/sensor-demo.json
      - run: python -m json.tool /tmp/sensor-demo.json >/dev/null
      - name: Local dashboard end-to-end smoke
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          import time
          from urllib.request import urlopen
          p = subprocess.Popen([sys.executable, "-m", "sensor_swarm", "live-demo",
                                "--port", "8876", "--interval", "2",
                                "--db", "/tmp/sensor-swarm-e2e.sqlite3"],
                               stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
          try:
              for attempt in range(30):
                  try:
                      with urlopen("http://127.0.0.1:8876/api/status", timeout=2) as r:
                          payload = json.load(r)
                      assert payload["stored_count"] >= 5, payload
                      assert payload["network_scanning"] is False, payload
                      break
                  except OSError:
                      time.sleep(0.3)
              else:
                  raise AssertionError("local dashboard did not respond")
          finally:
              p.terminate()
              try:
                  p.wait(timeout=3)
              except subprocess.TimeoutExpired:
                  p.kill()
                  p.wait(timeout=3)
          PY
