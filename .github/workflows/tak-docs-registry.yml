name: GPT-Doug Public TAK Documentation Registry

on:
  pull_request:
    paths:
      - 'tak_geo/docs_registry.py'
      - 'tak_geo/docs_portal.html'
      - 'tak_geo/cli.py'
      - 'tests/test_tak_docs.py'
      - 'docs/GPT_DOUG_TAK_DOCUMENTATION.md'
      - 'scripts/doug-max'
      - '.github/workflows/tak-docs-registry.yml'
  push:
    branches: [main]
    paths:
      - 'tak_geo/docs_registry.py'
      - 'tak_geo/docs_portal.html'
      - 'tak_geo/cli.py'
      - 'tests/test_tak_docs.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-reference-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install 'pytest>=7,<10'
      - name: Compile, validate docs link graph and local-only safeguards
        run: |
          python -m compileall -q tak_geo
          python -m pytest -q tests/test_tak_docs.py tests/test_tak_geo.py tests/test_gpt_brain.py
          bash -n scripts/doug-max
      - name: Check documentation portal JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          content=Path('tak_geo/docs_portal.html').read_text(encoding='utf-8')
          assert content.count('__TAK_DOCS_REGISTRY__') == 1
          code=content.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/gpt-doug-tak-docs.js').write_text(code)
          PY
          node --check /tmp/gpt-doug-tak-docs.js
      - name: Generate disconnected documentation index
        run: |
          python -m tak_geo docs-status > /tmp/official-tak-docs-status.json
          python -m tak_geo docs-build --output build/tak-docs
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('build/tak-docs')
          registry=json.loads((root/'docs-registry.json').read_text())
          status=json.loads(Path('/tmp/official-tak-docs-status.json').read_text())
          assert status["restricted_documents_retrieved"] is False
          assert registry["authenticated_library_scraped"] is False
          assert registry["sdk_installed"] is False
          assert registry["third_party_pipeline"]["authenticated_release_compilation"] == "NOT_RUN"
          assert registry["third_party_pipeline"]["signed_apk"] == "NOT_AVAILABLE"
          assert (root/'docs.html').is_file()
          print('Curated TAK doc refs:', registry['document_count'])
          PY
      - name: Upload public reference page, no gated content
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: gpt-doug-public-tak-docs-reference-atlas
          path: build/tak-docs/
          retention-days: 14
          if-no-files-found: error
