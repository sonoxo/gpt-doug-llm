name: GPT ZYRA Shaggoth hardening gate

on:
  push:
    branches: [main]
    paths:
      - "gpt_zyra_shaggoth/**"
      - "tests/test_gpt_zyra_shaggoth_nexus.py"
      - "tests/test_gpt_zyra_shaggoth.py"
      - "tests/test_gpt_zyra_defensive_arsenal.py"
      - "scripts/gpt-doug-swarm"
      - "scripts/install-gpt-zyra-shaggoth"
      - "pyproject.toml"
      - "SECURITY.md"
      - ".github/CODEOWNERS"
      - ".github/workflows/zyra-shaggoth-hardening.yml"
  pull_request:
    branches: [main]
    paths:
      - "gpt_zyra_shaggoth/**"
      - "tests/test_gpt_zyra_shaggoth_nexus.py"
      - "tests/test_gpt_zyra_shaggoth.py"
      - "tests/test_gpt_zyra_defensive_arsenal.py"
      - "scripts/gpt-doug-swarm"
      - "scripts/install-gpt-zyra-shaggoth"
      - "pyproject.toml"
      - "SECURITY.md"
      - ".github/CODEOWNERS"
      - ".github/workflows/zyra-shaggoth-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zyra-shaggoth-hardening-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile hardened bridge
        run: |
          python -m py_compile \
            gpt_zyra_shaggoth/__init__.py \
            gpt_zyra_shaggoth/__main__.py \
            gpt_zyra_shaggoth/bridge.py \
            gpt_zyra_shaggoth/arsenal.py \
            gpt_zyra_shaggoth/nexus.py \
            gpt_zyra_shaggoth/cli.py \
            tests/test_gpt_zyra_shaggoth.py \
            tests/test_gpt_zyra_defensive_arsenal.py \
            tests/test_gpt_zyra_shaggoth_nexus.py

      - name: Run isolated hardening regression
        run: PYTHONPATH=. python -m unittest tests.test_gpt_zyra_shaggoth -v

      - name: Run defensive arsenal regression
        run: PYTHONPATH=. python -m unittest tests.test_gpt_zyra_defensive_arsenal -v

      - name: Run Nexus projection regressions
        run: PYTHONPATH=. python -m unittest tests.test_gpt_zyra_shaggoth_nexus -v

      - name: Validate GPT-DOUG swarm launcher
        run: bash -n scripts/gpt-doug-swarm

      - name: Validate macOS launcher repair syntax
        run: bash -n scripts/install-gpt-zyra-shaggoth

      - name: Exercise launcher repair in isolated HOME
        shell: bash
        run: |
          set -euo pipefail
          temp_home="$(mktemp -d)"
          trap 'rm -rf "$temp_home"' EXIT
          export HOME="$temp_home"
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\\necho stale-launcher\\n' > "$HOME/.local/bin/gpt-doug-swarm"
          chmod 755 "$HOME/.local/bin/gpt-doug-swarm"
          bash scripts/install-gpt-zyra-shaggoth --no-shell-config
          "$HOME/.local/bin/gpt-doug-swarm" help | grep -Fq 'gpt-doug-swarm arsenal'
          "$HOME/.local/bin/gpt-zyra-shaggoth" --state-dir "$HOME/verified" verify > "$HOME/verified.json"
          python - "$HOME/verified.json" <<'PY'
          import json
          import sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          assert payload["ok"] is True
          print("SHAGGOTH MACOS LAUNCHER REPAIR: GREEN")
          PY
          test -n "$(find "$HOME/.gpt-doug/launcher-backups" -type f -name gpt-doug-swarm -print -quit)"
          bash scripts/install-gpt-zyra-shaggoth --no-shell-config

      - name: Validate local CLI metadata
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          payload = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          assert payload["project"]["scripts"]["gpt-zyra-shaggoth"] == "gpt_zyra_shaggoth.cli:main"
          assert "gpt_zyra_shaggoth" in payload["tool"]["setuptools"]["packages"]
          print("GPT-ZYRA-SHAGGOTH CLI METADATA: GREEN")
          PY

      - name: Verify checkout hardwire
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          PYTHONPATH=. python -m gpt_zyra_shaggoth --state-dir "$tmp" verify > "$tmp/verify.json"
          python - "$tmp/verify.json" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          assert payload["system"] == "GPT-ZYRA-SHAGGOTH"
          assert payload["mode"] == "LOCAL_HARDENED"
          assert payload["ok"] is True
          assert payload["checks"]["github_delivery_denied"] is True
          assert payload["checks"]["network_provider_denied"] is True
          print("GPT-ZYRA-SHAGGOTH HARDWIRE: GREEN")
          PY
