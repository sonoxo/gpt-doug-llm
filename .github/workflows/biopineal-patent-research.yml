name: BioPineal public patent evidence check
on:
  pull_request:
    paths:
      - "research_lab/biopineal_patent.py"
      - "tests/test_biopineal_patent.py"
      - "docs/BIOPINEAL_LITHIUM_HYDROGEN_PATENT.md"
      - "scripts/doug-max"
      - ".github/workflows/biopineal-patent-research.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test patent provenance, balance, and safety boundary
        run: python3 -m unittest discover -s tests -p 'test_biopineal_patent.py' -v
      - name: Confirm CLI route and replay
        run: |
          bash -n scripts/doug-max
          bash scripts/doug-max biopineal-patent show
          bash scripts/doug-max biopineal-patent report > /tmp/biopineal.json
          bash scripts/doug-max biopineal-patent verify /tmp/biopineal.json
          grep -F 'USER_SUPPLIED_PATENT_SEARCH_EXCERPT' /tmp/biopineal.json
