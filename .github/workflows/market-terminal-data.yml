name: GPT-DOUG Market Terminal Data
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 13-21 * * 1-5'
permissions:
  contents: write
concurrency:
  group: market-terminal-snapshot
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public market intelligence
        run: python3 market-terminal/scripts/collect_market_data.py
      - name: Validate snapshot
        run: python3 -m json.tool market-terminal/data/market-snapshot.json >/dev/null
      - name: Commit changed snapshot
        run: |
          git config user.name "gpt-doug-market-bot"
          git config user.email "actions@users.noreply.github.com"
          git add market-terminal/data/market-snapshot.json
          git diff --cached --quiet || git commit -m "data: refresh market terminal snapshot"
          git push
