name: GPT-DOUG Cinema OS E2E Gate
on:
  push:
    paths:
      - 'cinema_studio/**'
      - '.github/workflows/gpt-doug-cinema.yml'
  pull_request:
    paths:
      - 'cinema_studio/**'
      - 'docs/index.html'
      - 'docs/resources.json'
      - '.github/workflows/gpt-doug-cinema.yml'
permissions:
  contents: read
jobs:
  test-end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free MP4 encoder and probing tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Validate scripts and standalone browser source
        run: |
          bash -n cinema_studio/bootstrap_mac.sh
          bash -n cinema_studio/run_mac.sh
          bash -n cinema_studio/install_ai_mac.sh
          node --check cinema_studio/web/app.js
          python -m compileall -q cinema_studio
      - name: Run real local MP4 generation and HTTP export tests
        run: python -m unittest discover -s cinema_studio/tests -v
      - name: Verify no paid inference dependencies
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          for name in ('engine.py','server.py'):
              ast.parse((Path('cinema_studio') / name).read_text())
          s=(Path('cinema_studio')/'server.py').read_text()
          assert 'ThreadingHTTPServer(("127.0.0.1", port)' in s
          assert '/api/jobs' in s and '/api/assets/' in s
          print('Cinema OS: local-only server and output routes validated.')
          PY
