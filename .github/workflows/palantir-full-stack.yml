name: Palantir Full Stack Gate

on:
  push:
    branches: [main, dev]
    paths:
      - "palantir_*.py"
      - "wakeup3lm/palantir.py"
      - "zyrapalantir/**"
      - "tests/test_palantir_full_stack.py"
      - "tests/test_zyrapalantir_backbone.py"
      - ".github/workflows/palantir-full-stack.yml"
  pull_request:
    paths:
      - "palantir_*.py"
      - "wakeup3lm/palantir.py"
      - "zyrapalantir/**"
      - "tests/test_palantir_full_stack.py"
      - "tests/test_zyrapalantir_backbone.py"
      - ".github/workflows/palantir-full-stack.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-stack:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Compile Palantir adapters and ZYRAPALANTIR backbone
        run: python -m compileall palantir_aip.py palantir_automate.py palantir_gotham.py palantir_apollo.py palantir_tenant_probe.py palantir_terminal.py wakeup3lm/palantir.py zyrapalantir
      - name: Run full stack contract tests
        run: python -m pytest tests/test_palantir_full_stack.py tests/test_zyrapalantir_backbone.py -q
