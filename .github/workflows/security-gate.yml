name: Security gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ZYRA Agent Core native self-test
        run: python zyra_agent.py --self-test

      - name: ZYRA LASER native self-test
        run: python zyra_laser.py

      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff pip-audit bandit cyclonedx-bom cryptography

      - name: Tests
        run: python -m pytest tests agents/tests google/tests hackathon/tests -q

      - name: Ruff
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            mapfile -t PY_FILES < <(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- '*.py')
            if [ "${#PY_FILES[@]}" -gt 0 ]; then
              printf 'Linting changed Python files:\n%s\n' "${PY_FILES[@]}"
              ruff check "${PY_FILES[@]}"
            else
              echo "No changed Python files to lint."
            fi
          else
            ruff check .
          fi

      - name: Bandit
        run: bandit -r . -x ./tests,./agents/tests,./google/tests,./hackathon/tests -ll

      - name: Dependency audit
        run: pip-audit

      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment --output-file sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error
