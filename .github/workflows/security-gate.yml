name: Security gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ZYRA Agent Core native self-test
        run: python zyra_agent.py --self-test

      - name: ZYRA LASER native self-test
        run: python zyra_laser.py

      - name: Install security tooling and runtime test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./va3lm[dev]"
          python -m pip install ruff pip-audit bandit cyclonedx-bom cryptography

      - name: Verify Black House runtime dependency contract
        run: |
          python -c "import fastapi, httpx, pydantic, va3lm; print('VA3LM runtime dependencies OK')"

      - name: Tests
        run: python -m pytest tests agents/tests google/tests hackathon/tests -q

      - name: Ruff — changed Python files
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DIFF_BASE="origin/${{ github.base_ref }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            DIFF_BASE="${{ github.event.before }}"
          else
            DIFF_BASE="HEAD^"
          fi

          mapfile -t PY_FILES < <(
            git diff --name-only --diff-filter=ACMR "${DIFF_BASE}...HEAD" -- '*.py'
          )

          if [ "${#PY_FILES[@]}" -gt 0 ]; then
            printf 'Linting changed Python files:\n%s\n' "${PY_FILES[@]}"
            ruff check "${PY_FILES[@]}"
          else
            echo "No changed Python files to lint."
          fi

      - name: Bandit — no new security regressions
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DIFF_BASE="origin/${{ github.base_ref }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            DIFF_BASE="${{ github.event.before }}"
          else
            DIFF_BASE="HEAD^"
          fi

          mapfile -t PY_FILES < <(
            git diff --name-only --diff-filter=ACMR "${DIFF_BASE}...HEAD" -- '*.py' |
              grep -Ev '(^|/)(tests?|test_[^/]*)/' || true
          )

          if [ "${#PY_FILES[@]}" -gt 0 ]; then
            printf 'Bandit scanning changed production Python files:\n%s\n' "${PY_FILES[@]}"
            bandit -ll "${PY_FILES[@]}"
          else
            echo "No changed production Python files to scan with Bandit."
          fi

      - name: Dependency audit
        run: pip-audit

      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment --output-file sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error
