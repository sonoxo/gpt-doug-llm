name: Security gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff pip-audit bandit cyclonedx-bom cryptography

      - name: Tests
        run: python -m pytest tests agents/tests google/tests hackathon/tests -q

      - name: Ruff
        run: ruff check .

      - name: Bandit
        run: bandit -r . -x ./tests,./agents/tests,./google/tests,./hackathon/tests -ll

      - name: Dependency audit
        run: pip-audit

      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment --output-file sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error
