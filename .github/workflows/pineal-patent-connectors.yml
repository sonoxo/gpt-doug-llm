name: PINEAL Patent Connector Tests
on:
  pull_request:
    paths:
      - 'integrations/gpt-doug-pineal/**'
      - '.github/workflows/pineal-patent-connectors.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/gpt-doug-pineal/**'
      - '.github/workflows/pineal-patent-connectors.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install PINEAL and pytest
        run: |
          python -m pip install 'integrations/gpt-doug-pineal[test]'
      - name: Unit and mocked-provider integration tests (never use live credentials)
        working-directory: integrations/gpt-doug-pineal
        run: |
          python -m pytest -q
          python -m pineal --home /tmp/pineal-ci patents connect-status
          python -m pineal --home /tmp/pineal-ci patents sync examples/patents/sample-publication-ids.txt --source epo-ops --dry-run
          python -m pineal --home /tmp/pineal-ci blink --frames 1 --no-color
