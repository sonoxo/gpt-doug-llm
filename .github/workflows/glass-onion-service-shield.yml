name: Glass Onion Service Shield Gate

on:
  pull_request:
    paths:
      - 'kraken_shield/**'
      - 'tests/test_glass_onion_service_shield.py'
      - 'apps/zyra-jukebox/**'
      - 'docs/jukebox/**'
      - 'docs/GLASSONION_MUSIC_BANK_SHIELD.md'
      - '.github/workflows/glass-onion-service-shield.yml'
  push:
    branches: [main]
    paths:
      - 'kraken_shield/**'
      - 'tests/test_glass_onion_service_shield.py'
      - 'apps/zyra-jukebox/**'
      - 'docs/jukebox/**'
      - '.github/workflows/glass-onion-service-shield.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Validate policy and ontology without accounts
        run: |
          python -m compileall -q kraken_shield
          python -m json.tool kraken_shield/ontology.json >/dev/null
          python -m unittest discover -s tests -p 'test_glass_onion_service_shield.py' -v
      - name: Assert banking transfers are denied
        run: |
          set +e
          python -m kraken_shield service-check --sector bank --service bank --operation transfer </dev/null
          code=$?
          test "$code" -eq 3

  jukebox-links:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test music-link guard (no network)
        run: |
          node --check apps/zyra-jukebox/app.js
          node --check apps/zyra-jukebox/glass-onion-shield.js
          node --check docs/jukebox/app.js
          node --check docs/jukebox/glass-onion-shield.js
          node --test apps/zyra-jukebox/glass-onion-shield.test.cjs
