name: XUNIA Glass Onion end-to-end validation

on:
  pull_request:
    paths:
      - 'docs/darkweb/**'
      - 'docs/index.html'
      - 'scripts/xunia_authorized_crawl.py'
      - 'scripts/xunia_glass_onion_verify.py'
      - 'tests/xunia_glass_onion.test.mjs'
      - 'tests/xunia_usa_defense_scope.test.mjs'
      - 'tests/xunia_cosmos_eyes.test.mjs'
      - 'tests/xunia_nonkinetic_ontology.test.mjs'
      - 'tests/xunia_fieldlab_live_model.test.mjs'
      - 'tests/test_xunia_authorized_crawl.py'
      - 'tests/glass-onion-browser/**'
      - '.github/workflows/glass-onion.yml'
  push:
    branches: [main]
    paths:
      - 'docs/darkweb/**'
      - 'docs/index.html'
      - 'scripts/xunia_authorized_crawl.py'
      - 'scripts/xunia_glass_onion_verify.py'
      - 'tests/xunia_glass_onion.test.mjs'
      - 'tests/xunia_usa_defense_scope.test.mjs'
      - 'tests/xunia_cosmos_eyes.test.mjs'
      - 'tests/xunia_nonkinetic_ontology.test.mjs'
      - 'tests/xunia_fieldlab_live_model.test.mjs'
      - 'tests/test_xunia_authorized_crawl.py'
      - 'tests/glass-onion-browser/**'
      - '.github/workflows/glass-onion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify source and every catalog entry
        run: |
          node --check docs/darkweb/core.mjs
          node --check docs/darkweb/app.mjs
          node --check docs/darkweb/usa-scope.mjs
          node --check docs/darkweb/usa-scope-app.mjs
          node --test tests/xunia_usa_defense_scope.test.mjs
          node --check docs/darkweb/global/feed-core.mjs
          node --check docs/darkweb/global/global.mjs
          node --test tests/xunia_global_observatory.test.mjs
          node --check docs/darkweb/cosmos/feed-core.mjs
          node --check docs/darkweb/cosmos/cosmos.mjs
          node --test tests/xunia_cosmos_eyes.test.mjs
          node --check docs/darkweb/nonkinetic/core.mjs
          node --check docs/darkweb/nonkinetic/app.mjs
          node --test tests/xunia_nonkinetic_ontology.test.mjs
          node --check docs/darkweb/fieldlab/model-core.mjs
          node --check docs/darkweb/fieldlab/earth-renderer.mjs
          node --check docs/darkweb/fieldlab/fieldlab.mjs
          node --test tests/xunia_fieldlab_live_model.test.mjs
          python3 -m json.tool docs/darkweb/nonkinetic/ontology.json >/dev/null
          python3 -m json.tool docs/darkweb/usa-defense-scope.json >/dev/null
          node --test tests/xunia_glass_onion.test.mjs
          python3 -m py_compile scripts/xunia_authorized_crawl.py scripts/xunia_glass_onion_verify.py
          python3 -m unittest discover -s tests -p 'test_xunia_authorized_crawl.py' -v
      - name: Verify deployed artifact contract
        run: |
          test -s docs/darkweb/index.html
          test -s docs/darkweb/styles.css
          test -s docs/darkweb/app.mjs
          test -s docs/darkweb/core.mjs
          grep -q './darkweb/' docs/index.html
          grep -q 'XUNIA // GLASS ONION' docs/darkweb/index.html
          python3 - <<'PY'
          from pathlib import Path
          html=Path("docs/darkweb/index.html").read_text()
          app=Path("docs/darkweb/app.mjs").read_text()
          assert "Content-Security-Policy" in html
          assert "no-referrer" in html
          for module in ["discovery","exposure","evidence","threat","directory","collection","privacy","pgp"]:
              assert f'data-engine="{module}"' in html, module
          for feature in ["telegram-file","bookmark-form","privacy-run"]:
              assert feature in html, feature
              assert feature in app, feature
          assert "--authorized" in html
          import json
          scope=json.loads(Path("docs/darkweb/usa-defense-scope.json").read_text())
          assert len(scope["sectors"])==16
          assert len(scope["functions"])==6
          assert scope["status"]=="PLANNING_ONLY_NO_NATIONWIDE_PROTECTION"
          assert 'id="usa-defense"' in html
          assert 'usa-scope-app.mjs' in html
          assert 'href="./global/"' in html
          assert 'href="./cosmos/"' in html
          assert 'href="./nonkinetic/"' in html
          assert 'href="./fieldlab/"' in html
          fieldlab_html=Path("docs/darkweb/fieldlab/index.html").read_text()
          assert "SWARM" in fieldlab_html and "HIVE" in fieldlab_html and "SWEEP" in fieldlab_html
          assert "Content-Security-Policy" in fieldlab_html
          arsenal_html=Path("docs/darkweb/nonkinetic/index.html").read_text()
          assert "NON-KINETIC ARSENAL" in arsenal_html
          assert "Content-Security-Policy" in arsenal_html
          assert Path("docs/darkweb/nonkinetic/ontology.json").stat().st_size > 1000
          cosmos_html=Path('docs/darkweb/cosmos/index.html').read_text()
          assert 'COSMOS EYES' in cosmos_html
          assert 'Content-Security-Policy' in cosmos_html
          global_html=Path("docs/darkweb/global/index.html").read_text()
          assert "GLOBAL OBSERVATORY" in global_html
          assert "Content-Security-Policy" in global_html
          assert Path("docs/darkweb/global/world-land.svg").stat().st_size > 1000
          PY

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned open-source test dependencies
        run: |
          cd tests/glass-onion-browser
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          mkdir -p artifacts
      - name: Run real browser user journeys
        run: |
          cd tests/glass-onion-browser
          npm test
      - name: Publish browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xunia-glass-onion-browser-evidence
          path: |
            tests/glass-onion-browser/artifacts/
            tests/glass-onion-browser/test-results/
          if-no-files-found: ignore
          retention-days: 14

  official-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify real official public endpoints
        run: |
          python3 scripts/xunia_glass_onion_verify.py --mode sources --retries 2 --interval 4 --output glass-onion-source-evidence.json
      - name: Upload source verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xunia-glass-onion-source-evidence
          path: glass-onion-source-evidence.json
          if-no-files-found: ignore
          retention-days: 14

  live-site:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, browser, official-sources]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Verify site after main merge and Pages publish
        run: |
          python3 scripts/xunia_glass_onion_verify.py --mode site --retries 30 --interval 12 --output glass-onion-live-evidence.json
      - name: Upload published-site verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xunia-glass-onion-live-evidence
          path: glass-onion-live-evidence.json
          if-no-files-found: ignore
          retention-days: 14
