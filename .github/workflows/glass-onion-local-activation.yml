name: Glass Onion Local Activation Gate

on:
  pull_request:
    paths:
      - 'scripts/glass-onion-activate.sh'
      - 'kraken_shield/**'
      - 'apps/zyra-jukebox/**'
      - 'tests/test_glass_onion_service_shield.py'
      - '.github/workflows/glass-onion-local-activation.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/glass-onion-activate.sh'
      - '.github/workflows/glass-onion-local-activation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-activation-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify activation command syntax
        run: bash -n scripts/glass-onion-activate.sh
      - name: Verify banking default-deny and local audit offline
        run: python -m unittest discover -s tests -p 'test_glass_onion_service_shield.py' -v
      - name: Verify guarded music playback and URL checks offline
        run: |
          node --check apps/zyra-jukebox/glass-onion-shield.js
          node --test apps/zyra-jukebox/glass-onion-shield.test.cjs
      - name: Verify the launcher never provisions cloud billing
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path("scripts/glass-onion-activate.sh").read_text()
          assert "export PAID_MODE=false" in src or "PAID_MODE=false" in src
          assert "KRAKEN_SHIELD_ENFORCE=true" in src
          assert 'check_service("bank", "unconnected", "transfer")' in src
          assert 'bank["decision"] != "BLOCK"' in src
          assert "--bind 127.0.0.1" in src
          assert "GLASSONION_KEYCHAIN_ACCOUNT" not in src
          assert "revealio" not in src
          PY
