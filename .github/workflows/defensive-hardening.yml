name: Defensive hardening gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate defensive hardening policy
        run: python scripts/validate_defensive_hardening.py

      - name: Compile defensive validators
        run: |
          python -m py_compile \
            scripts/validate_defensive_hardening.py \
            scripts/validate_infrastructure_resilience.py

      - name: Determine changed protected files
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ -n "${GITHUB_BASE_REF:-}" ]; then
            BASE="origin/${GITHUB_BASE_REF}"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            BASE="HEAD^"
          else
            BASE=""
          fi

          if [ -n "$BASE" ]; then
            git diff --name-only "$BASE"...HEAD -- .github/workflows scripts safety-shield > /tmp/protected_changed.txt
          else
            git ls-files .github/workflows scripts safety-shield > /tmp/protected_changed.txt
          fi

          echo "Changed protected files:"
          cat /tmp/protected_changed.txt || true

      - name: Reject dangerous workflow triggers in changed workflows
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t FILES < <(grep -E '^\.github/workflows/.*\.(yml|yaml)$' /tmp/protected_changed.txt || true)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No changed workflow files."
            exit 0
          fi
          if grep -nH 'pull_request_target:' "${FILES[@]}"; then
            echo "pull_request_target is not permitted in changed workflows."
            exit 1
          fi

      - name: Reject broad workflow write permissions in changed workflows
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t FILES < <(grep -E '^\.github/workflows/.*\.(yml|yaml)$' /tmp/protected_changed.txt || true)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No changed workflow files."
            exit 0
          fi
          if grep -nHE '^[[:space:]]*permissions:[[:space:]]*write-all[[:space:]]*$' "${FILES[@]}"; then
            echo "write-all workflow permissions are forbidden in changed workflows."
            exit 1
          fi

      - name: Check changed protected files for remote pipe-to-shell
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t FILES < <(grep -E '\.(sh|yml|yaml)$' /tmp/protected_changed.txt || true)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No changed shell/workflow files."
            exit 0
          fi
          if grep -nHE '(curl|wget)[^|]{0,200}\|[[:space:]]*(sh|bash)' "${FILES[@]}"; then
            echo "Remote pipe-to-shell bootstrap detected in changed protected files."
            exit 1
          fi

      - name: Verify policy files parse as JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("safety-shield/policies").glob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print("OK", path)
          PY

      - name: Produce hardening evidence
        run: |
          mkdir -p artifacts
          {
            echo "branch=${GITHUB_REF_NAME}"
            echo "sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "event=${GITHUB_EVENT_NAME}"
            date -u +"generated_at=%Y-%m-%dT%H:%M:%SZ"
          } > artifacts/defensive-hardening-evidence.txt

      - name: Upload hardening evidence
        uses: actions/upload-artifact@v4
        with:
          name: defensive-hardening-evidence
          path: artifacts/defensive-hardening-evidence.txt
          if-no-files-found: error
