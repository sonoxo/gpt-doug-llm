name: GPT-Doug TAK-OS / Free Simulator Gate

on:
  pull_request:
    paths:
      - 'docs/tak-os/**'
      - 'docs/resources.json'
      - 'docs/index.html'
      - 'tests/test_tak_os_static.py'
      - '.github/workflows/tak-os-free.yml'
  push:
    branches: [main]
    paths:
      - 'docs/tak-os/**'
      - 'docs/resources.json'
      - 'docs/index.html'
      - 'tests/test_tak_os_static.py'
      - '.github/workflows/tak-os-free.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Static, legal, free-tier, VM and catalog contracts
        run: python3 -m unittest discover -s tests -p 'test_tak_os_static.py' -v

      - name: JavaScript parse validation (no npm install)
        run: |
          node --check docs/tak-os/sw.js
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          import tempfile

          class ScriptParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script=False
                  self.parts=[]
                  self.scripts=[]
              def handle_starttag(self, tag, attrs):
                  if tag == 'script' and not dict(attrs).get('src'):
                      self.in_script=True
                      self.parts=[]
              def handle_data(self, data):
                  if self.in_script:
                      self.parts.append(data)
              def handle_endtag(self, tag):
                  if tag == 'script' and self.in_script:
                      self.scripts.append(''.join(self.parts))
                      self.in_script=False

          parser=ScriptParser()
          parser.feed(Path('docs/tak-os/index.html').read_text())
          assert parser.scripts, 'No runnable JS in standalone console'
          for num, code in enumerate(parser.scripts):
              with tempfile.TemporaryDirectory() as tempdir:
                  output=Path(tempdir)/f'app_{num}.js'
                  output.write_text(code)
                  subprocess.run(['node','--check',str(output)],check=True)
          print(f'PASS: {len(parser.scripts)} inline JS scripts parsed')
          PY

      - name: Static hosting smoke test
        run: |
          set -euo pipefail
          python3 -m http.server 18908 --bind 127.0.0.1 --directory docs/tak-os >/tmp/tak-os-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:18908/ >/tmp/tak-os.html; then break; fi
            sleep 0.2
          done
          grep -q 'Common Operating Picture' /tmp/tak-os.html
          curl --fail --silent http://127.0.0.1:18908/manifest.webmanifest | grep -q 'TAK-OS Demo'
          curl --fail --silent http://127.0.0.1:18908/sw.js | grep -q 'CACHE'
          echo 'STATIC_TAK_OS_DEMO=PASS'
