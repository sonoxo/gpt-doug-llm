name: GPT-Doug TAK-OS / Complete Free Local Gateway Gate

on:
  pull_request:
    paths:
      - 'docs/tak-os/**'
      - 'docs/resources.json'
      - 'docs/index.html'
      - 'tests/test_tak_os_gateway.py'
      - 'tests/test_tak_os_static.py'
      - 'tests/test_tak_os_swarm.py'
      - 'tests/test_tak_os_swarm_browser.py'
      - '.github/workflows/tak-os-free.yml'
  push:
    branches: [main]
    paths:
      - 'docs/tak-os/**'
      - 'docs/resources.json'
      - 'docs/index.html'
      - 'tests/test_tak_os_gateway.py'
      - 'tests/test_tak_os_static.py'
      - 'tests/test_tak_os_swarm.py'
      - 'tests/test_tak_os_swarm_browser.py'
      - '.github/workflows/tak-os-free.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-gateway-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python CoT XML / HTTP / SQLite / SSE / UDP / TCP integration
        run: python3 -m unittest discover -s tests -p 'test_tak_os_gateway.py' -v
      - name: GPT-Doug / GPT-Chaos local defensive swarm security and CoT approval gates
        run: python3 -m unittest discover -s tests -p 'test_tak_os_swarm.py' -v
      - name: Static/PWA/CI security contracts
        run: python3 -m unittest discover -s tests -p 'test_tak_os_static.py' -v
      - name: JavaScript syntax (no npm dependencies)
        run: |
          node --check docs/tak-os/app.js
          node --check docs/tak-os/bridge.js
          node --check docs/tak-os/swarm-ui.js
          node --check docs/tak-os/sw.js
      - name: Shell launch scripts syntax
        run: |
          sh -n docs/tak-os/start.sh
          sh -n docs/tak-os/vm/launch.sh
      - name: Compile backend modules
        run: python3 -m py_compile docs/tak-os/gateway.py docs/tak-os/swarm.py
      - name: Resource catalog contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path('docs/resources.json').read_text())
          records = [x for x in registry['items'] if x.get('id') == 'gpt-doug-tak-os']
          assert len(records) == 1
          assert records[0]['access'] == 'public' and records[0]['free'] is True
          assert records[0]['url'] == './tak-os/'
          assert 'href="./tak-os/"' in Path('docs/index.html').read_text()
          print('FREE_TAK_OS_CATALOG=PASS')
          PY
