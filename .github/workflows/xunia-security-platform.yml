name: XUNIA Security Platform

on:
  pull_request:
    paths:
      - "xunia_security.py"
      - "xunia_security_executor.py"
      - "xunia_findings.py"
      - "xunia_realtime_runtime.py"
      - "xunia_realtime_watch.py"
      - "tests/test_xunia_security.py"
      - "tests/test_xunia_security_executor.py"
      - "tests/test_xunia_findings.py"
      - "tests/test_xunia_realtime_runtime.py"
      - ".github/workflows/xunia-security-platform.yml"
  push:
    branches: [main]
    paths:
      - "xunia_security.py"
      - "xunia_security_executor.py"
      - "xunia_findings.py"
      - "xunia_realtime_runtime.py"
      - "xunia_realtime_watch.py"
      - "tests/test_xunia_security.py"
      - "tests/test_xunia_security_executor.py"
      - "tests/test_xunia_findings.py"
      - "tests/test_xunia_realtime_runtime.py"

permissions:
  contents: read

jobs:
  authorized-security-platform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: >-
          python -m unittest
          tests.test_xunia_security
          tests.test_xunia_security_executor
          tests.test_xunia_findings
          tests.test_xunia_realtime_runtime
          -v
