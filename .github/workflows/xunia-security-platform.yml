name: XUNIA Security Platform

on:
  pull_request:
    paths:
      - "xunia_security.py"
      - "xunia_security_executor.py"
      - "tests/test_xunia_security.py"
      - "tests/test_xunia_security_executor.py"
      - ".github/workflows/xunia-security-platform.yml"
  push:
    branches: [main]
    paths:
      - "xunia_security.py"
      - "xunia_security_executor.py"
      - "tests/test_xunia_security.py"
      - "tests/test_xunia_security_executor.py"

permissions:
  contents: read

jobs:
  authorized-security-platform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest tests.test_xunia_security tests.test_xunia_security_executor -v
