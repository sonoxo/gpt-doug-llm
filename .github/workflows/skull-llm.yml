name: SKULL-LLM neural and local runtime

on:
  pull_request:
    paths:
      - "skull_llm/**"
      - "tests/test_skull_llm.py"
      - "tests/test_skull_terminal_live.py"
      - "tests/test_skull_cockpit_v2.py"
      - "tests/test_skull_framework_bridge.py"
      - "tests/test_framework_health_skull.py"
      - "pyproject.toml"
      - "docs/SKULL_LLM.md"
      - ".github/workflows/skull-llm.yml"
  push:
    branches: [main]
    paths:
      - "skull_llm/**"
      - "tests/test_skull_llm.py"
      - "tests/test_skull_terminal_live.py"
      - "tests/test_skull_cockpit_v2.py"
      - "tests/test_skull_framework_bridge.py"
      - "tests/test_framework_health_skull.py"
      - "pyproject.toml"
      - ".github/workflows/skull-llm.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Validate syntax and package installation
        run: |
          python -m compileall -q skull_llm tests/test_skull_llm.py
          python -m pip install -e .
          skull-llm --help
          skull-llm bench --help
          gpt-doug skull --help
          gpt-doug health --json > /tmp/skull-framework-health.json
          biochip-cl1-skull-gpt-skull --help
          biochip-cl1-skull-gpt-skull --once > /tmp/skull-terminal-frame.txt
          biochip-cl1-skull-gpt-skull --frames 2 --fps 24 > /tmp/skull-terminal-twice.txt
          biochip-cl1-skull-gpt-skull status > /tmp/skull-terminal-status.json
          skull-llm live --once > /tmp/skull-terminal-live.txt
          skull-llm banner --width 80 > /tmp/skull-banner.txt
          skull-llm network --width 80 > /tmp/skull-network.txt
          skull-llm dashboard --width 80 > /tmp/skull-dashboard.txt
      - name: Offline runtime tests (no network or keys)
        run: python -m unittest tests.test_skull_llm -v
      - name: Terminal-first 3D skull simulation and CLI integration
        run: python -m unittest tests.test_skull_terminal_live -v
      - name: Adaptive terminal HUD, zoom, snapshots and phase trace
        run: python -m unittest tests.test_skull_cockpit_v2 -v
      - name: Integration bridge, bounded benchmark and graphics status
        run: |
          python -m unittest tests.test_skull_framework_bridge tests.test_framework_health_skull -v
          gpt-doug health --verify-skull --strict
      - name: 3D cockpit loopback HTTP API and static asset tests
        run: python -m unittest tests.test_skull_3d -v
      - name: Validate interactive 3D JavaScript syntax
        run: |
          node --check skull_llm/static/skull.js
          node --check skull_llm/static/fallback.js
          skull-llm serve --help

  neural-training:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install open-source CPU PyTorch
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e . Pillow
      - name: Execute causal attention, gradient and checkpoint tests
        run: python -m unittest tests.test_skull_llm -v
