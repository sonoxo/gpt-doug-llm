name: Watch Dog TypeScript

on:
  push:
    branches:
      - gpt-doug-lllm-watch-dog
    paths:
      - 'watch-dog/**'
      - '.github/workflows/watch-dog-typescript.yml'
  pull_request:
    paths:
      - 'watch-dog/**'
      - '.github/workflows/watch-dog-typescript.yml'

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watch-dog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: watch-dog/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
