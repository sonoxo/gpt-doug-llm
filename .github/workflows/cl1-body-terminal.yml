name: CL1 Full Body Binary Terminal

on:
  pull_request:
    paths:
      - "scripts/cl1_body_terminal.py"
      - "tests/test_cl1_body_terminal.py"
      - "tests/test_cl1_mech_ontology.py"
      - "scripts/install_cl1_terminal.py"
      - "tests/test_cl1_installer.py"
      - "tests/test_cl1_performance.py"
      - "tests/test_cl1_terminal_updates.py"
      - "docs/CL1_FULL_BODY_TERMINAL.md"
      - "docs/CL1_MECHANICAL_ONTOLOGY.md"
      - ".github/workflows/cl1-body-terminal.yml"
  push:
    branches: [main, "feat/**"]
    paths:
      - "scripts/cl1_body_terminal.py"
      - "tests/test_cl1_body_terminal.py"
      - "tests/test_cl1_mech_ontology.py"
      - "scripts/install_cl1_terminal.py"
      - "tests/test_cl1_installer.py"
      - "tests/test_cl1_performance.py"
      - "tests/test_cl1_terminal_updates.py"
      - ".github/workflows/cl1-body-terminal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  body-renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify full-body geometry and binary CPU renderer offline
        run: python -m unittest tests.test_cl1_body_terminal tests.test_cl1_mech_ontology -v
      - name: Verify low-bandwidth Terminal updates and realistic colored-display metrics
        run: |
          python -m unittest tests.test_cl1_terminal_updates -v
          python scripts/cl1_body_terminal.py --benchmark 3 --width 90 --height 42 --color-detail fast > /tmp/cl1-terminal-io.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("/tmp/cl1-terminal-io.json").read_text())
          assert report["terminal_io_measured"] is False
          assert report["fps_is_projection_only"] is True
          assert report["changed_rows_frame_bytes"] <= report["full_colored_frame_bytes"]
          assert report["colored_format_mean_ms"] > 0
          print("CL1 colored bytes (full, diff):",
                report["full_colored_frame_bytes"], report["changed_rows_frame_bytes"])
          PY
      - name: Verify adaptive projection, cached skeletal layers and measured CPU FPS
        run: |
          python -m unittest tests.test_cl1_performance -v
          python scripts/cl1_body_terminal.py --benchmark 3 --width 90 --height 42 --quality auto > /tmp/cl1-perf.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("/tmp/cl1-perf.json").read_text())
          assert report["frames_measured"] == 3
          assert report["projected_points_per_frame"] <= 4*90*42
          assert report["projected_points_per_frame"] < report["source_points"]
          assert report["measured_fps"] > 0
          assert report["simulation_only"] is True
          print("Real CPU CL1 rendering benchmark:", report["measured_fps"], "frames/s")
          PY
      - name: Verify atomic installer, stale-version repair and real ontology commands
        run: |
          python -m unittest tests.test_cl1_installer -v
          python scripts/cl1_body_terminal.py --version
          python scripts/cl1_body_terminal.py --inspect left_forearm --joint-angle 65 --joint-speed 15 > /tmp/cl1-joint.json
          python scripts/cl1_body_terminal.py --ontology-json > /tmp/cl1-graph.json
          python - <<'PY'
          import json
          from pathlib import Path
          joint = json.loads(Path("/tmp/cl1-joint.json").read_text())
          graph = json.loads(Path("/tmp/cl1-graph.json").read_text())
          assert joint["id"] == "cl1:segment/left_forearm"
          assert joint["joint_evaluation"]["hardware_command_sent"] is False
          assert graph["entity_count"] >= 19
          assert graph["hardware_connected"] is False
          PY
      - name: Verify standalone program syntax and one-frame rendering
        run: |
          python -m py_compile scripts/cl1_body_terminal.py
          python scripts/cl1_body_terminal.py --once --width 105 --height 55 --mode skeleton --no-color > /tmp/cl1-body-frame.txt
          grep -q "FULL BODY" /tmp/cl1-body-frame.txt
          grep -q "CL1 NEURAL/BIOCHIP LAYER IS SIMULATED" /tmp/cl1-body-frame.txt
          python scripts/cl1_body_terminal.py --ontology-json > /tmp/cl1-mech.json
          python scripts/cl1_body_terminal.py --inspect left_forearm --joint-angle 45 > /tmp/cl1-elbow.json
          python - <<'PY'
          import json
          from pathlib import Path
          doc=json.loads(Path("/tmp/cl1-mech.json").read_text())
          joint=json.loads(Path("/tmp/cl1-elbow.json").read_text())
          assert doc["entity_count"] == 19 and len(doc["relations"]) == 18
          assert doc["simulation_only"] and not doc["hardware_connected"]
          assert joint["joint_evaluation"]["within_limits"]
          assert not joint["joint_evaluation"]["hardware_command_sent"]
          print("CL1 simulated mechanics ontology smoke PASS")
          PY
