name: GPT-Doug Millennium Forge exact certificates
on:
  pull_request:
    paths:
      - "research_lab/millennium_forge.py"
      - "tests/test_millennium*.py"
      - "docs/MILLENNIUM_FORGE_REPORT.md"
      - "run-Millennium-Forge.command"
      - "scripts/doug-max"
      - ".github/workflows/millennium-forge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-research:
    name: exact-7-problem-replay (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline bounded exact arithmetic tests
        run: python3 -m unittest discover -s tests -p 'test_millennium*.py' -v
      - name: Independent report replay with CLI
        run: |
          bash scripts/doug-max millennium-lab status
          bash run-Millennium-Forge.command demo > /tmp/millennium-report.json
          bash scripts/doug-max millennium-lab verify /tmp/millennium-report.json
