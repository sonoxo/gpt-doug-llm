name: Multimodel Biochip Research Gate

on:
  pull_request:
    paths:
      - 'gpt_doug_mlm/biochip_research.py'
      - 'tests/test_biochip_research.py'
      - 'gpt_doug_mlm/biopineal.py'
      - 'tests/test_biopineal_integration.py'
      - 'pyproject.toml'
      - '.github/workflows/multimodel-biochip-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install 'pytest>=7,<10'
      - name: Validate Python source
        run: python -m compileall -q gpt_doug_mlm/biochip_research.py gpt_doug_mlm/biopineal.py tests/test_biochip_research.py tests/test_biopineal_integration.py
      - name: Run isolated research tests
        run: python -m pytest -q tests/test_biochip_research.py tests/test_biopineal_integration.py
