name: GPT-Doug Math Mitochondria

on:
  push:
    paths:
      - 'gpt_brain/math_mitochondria.py'
      - 'gpt_brain/cli.py'
      - 'tests/test_math_mitochondria.py'
      - '.github/workflows/gpt-doug-math-mitochondria.yml'
  pull_request:
    paths:
      - 'gpt_brain/math_mitochondria.py'
      - 'gpt_brain/cli.py'
      - 'tests/test_math_mitochondria.py'
      - '.github/workflows/gpt-doug-math-mitochondria.yml'

jobs:
  math-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install exact math backend and tests
        run: python -m pip install 'sympy>=1.12,<2' 'pytest>=7'
      - name: Run mathematical verification tests
        run: python -m pytest -q tests/test_math_mitochondria.py
      - name: Test integrated GPT-Doug CLI
        run: |
          python -m gpt_brain.cli math solve 'x^2 - 5*x + 6 = 0'
          python -m gpt_brain.cli math verify 'x^2 - 1 = (x - 1)*(x + 1)'
          python -m gpt_brain.cli math doctor
