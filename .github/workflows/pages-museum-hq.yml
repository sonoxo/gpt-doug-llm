name: XUNIA Museum + HQ Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'CREATION_STANDARD.md'
      - '.github/workflows/pages-museum-hq.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'CREATION_STANDARD.md'
      - '.github/workflows/pages-museum-hq.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Assemble static site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R docs/. _site/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/resources.html
          test -f _site/resources.json
          test -f _site/experiments.html
          test -f _site/status.html
          test -f _site/metrics.html
          test -f _site/pipeline.html
          test -f _site/zyra-theme.css
          test -f _site/zyra-shell.js
          test -f _site/museum.css
          test -f _site/museum.js
          test -f _site/holo/index.html
          test -f _site/holo/holo.ts
          test -f _site/arcade/index.html
          test -f _site/cte/index.html
          test -f _site/tak-os/live-3d/index.html
          test -f _site/tak-os/live-3d/ontology.js
          test -f _site/tak-os/index.html
          test -f _site/tak-os/manifest.webmanifest
          test -f _site/tak-os/sw.js
          test ! -e _site/eye-mouse

      - name: Compile HOLO TypeScript
        run: |
          rm -f _site/holo/holo.js
          npx --yes -p typescript@5.6.3 tsc docs/holo/holo.ts \
            --target ES2020 \
            --lib DOM,ES2020 \
            --module ES2020 \
            --moduleDetection force \
            --strict \
            --skipLibCheck \
            --outDir _site/holo
          test -s _site/holo/holo.js

      - name: JavaScript syntax
        run: |
          node --check docs/zyra-shell.js
          node --check docs/museum.js
          node --check docs/cyber-swarm/engine.mjs
          node --check docs/cyber-swarm/app.mjs
          node --check docs/watchtower/app.js
          python3 -m unittest tests.test_universal_watchdog tests.test_watchtower_ontology tests.test_watchtower_client -v
          python3 -m compileall -q universal_watchdog
          node --test tests/cyber_swarm.test.mjs
          node --check _site/holo/holo.js

      - name: Interactive resource hub contract
        run: |
          grep -q 'Interactive Tools & Resources' docs/resources.html
          grep -q "\['Resources'" docs/zyra-shell.js
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('docs/resources.json').read_text(encoding='utf-8'))
          assert data.get('policy', {}).get('publicFreeFirst') is True
          assert data.get('policy', {}).get('catalogRequiredForInteractiveCreations') is True
          items = data.get('items')
          assert isinstance(items, list) and items, 'resource registry must not be empty'
          ids = [item.get('id') for item in items]
          assert len(ids) == len(set(ids)), 'duplicate resource ids'
          allowed = {'public', 'free-registration', 'free-tier', 'local-ready', 'local-required'}
          for item in items:
              for field in ('id', 'name', 'category', 'type', 'access', 'url', 'description'):
                  assert item.get(field), f"{item.get('id', '<unknown>')} missing {field}"
              assert item['access'] in allowed, f"invalid access label: {item['access']}"
              assert item.get('free') is True, f"{item['id']} violates zero-cost baseline"
              if item['access'] == 'local-required':
                  assert item.get('localOnlyReason'), f"{item['id']} requires localOnlyReason"
          assert any(item['id'] == 'green-house' for item in items), 'Green House missing from hub'
          PY

      - name: Museum inventory contract
        run: |
          grep -q 'XUNIAverse Museum + HQ' docs/index.html
          grep -q "'xuniadao'" docs/museum.js
          grep -q "'gpt-doug-llm'" docs/museum.js
          grep -q "'zyra'" docs/museum.js
          grep -q "'NASA-3D-ResourcesXUNIA-'" docs/museum.js
          grep -q "'xrpl4jXUNIA'" docs/museum.js
          grep -q "'nsacyber.github.ioZYRA'" docs/museum.js
          python3 - <<'PY'
          import re
          text = open('docs/museum.js', encoding='utf-8').read()
          block = re.search(r'const STATIC_REPOS = \[(.*?)\];', text, re.S).group(1)
          names = re.findall(r"'([^']+)'", block)
          assert len(names) == 62, f'expected 62 public exhibits, found {len(names)}'
          assert len(names) == len(set(names)), 'duplicate public exhibits'
          PY

      - name: Experimental project publication contract
        run: |
          grep -q 'XUNIA Sightline' docs/experiments.html
          grep -q 'COMING SOON' docs/experiments.html
          grep -q 'experiments.html' docs/index.html
          grep -q "\['Experiments'" docs/zyra-shell.js
          if grep -R -n -E 'Eye Mouse|eye-mouse' docs; then
            echo 'Unfinished prototype must not be exposed by the public site.' >&2
            exit 1
          fi

      - name: Arcade publication contract
        run: |
          test -f docs/arcade/index.html
          grep -q 'SUPER GALACTIK FEDERATION' docs/arcade/index.html
          grep -q 'XUNIA ARCADE ENTRY GATE' docs/arcade/index.html
          grep -q '5 ORIGINAL GAMES' docs/arcade/index.html
          grep -q 'href="./arcade/"' docs/index.html
          grep -q '^xunia.org$' docs/CNAME

      - name: CTE public showcase contract
        run: |
          test -f docs/cte/index.html
          grep -q 'ZYRA-CTE' docs/cte/index.html
          grep -q 'Counterfactual Transaction Engine' docs/cte/index.html
          grep -q 'SYNTHETIC-ONLY' docs/cte/index.html
          grep -q 'HUMAN CONTROL ENABLED' docs/cte/index.html

      - name: HOLO workable simulator contract
        run: |
          grep -q 'HOLO WORKABLE SIM' docs/holo/index.html
          grep -q 'type="module"' docs/holo/index.html
          grep -q 'XUNIA_HOLO_AAR_V1' docs/holo/holo.ts
          grep -q 'INJECT FAULT' docs/holo/index.html
          grep -q 'EXPORT AAR' docs/holo/index.html
          grep -q 'KeyW' docs/holo/holo.ts
          grep -q 'KeyE' docs/holo/holo.ts
          grep -q 'GitHub Pages static TypeScript simulator' docs/holo/holo.ts

      - name: Zyra theme and motion contract
        run: |
          grep -q '#46f3ff' docs/zyra-theme.css
          grep -q '#9d5cff' docs/zyra-theme.css
          grep -q 'prefers-reduced-motion' docs/zyra-theme.css
          grep -q 'motion-diagram' docs/index.html
          grep -q 'flow-normal' docs/pipeline.html

      - name: Static HTTP smoke test
        run: |
          python3 -m http.server 8080 --directory _site >/tmp/xunia-pages-http.log 2>&1 &
          PID=$!
          cleanup() { kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/ >/tmp/xunia-home.html; then break; fi
            sleep 0.2
          done
          grep -q 'The XUNIAverse Museum + HQ' /tmp/xunia-home.html
          grep -q 'arcade/' /tmp/xunia-home.html
          grep -q 'museum.js' /tmp/xunia-home.html
          curl -fsS http://127.0.0.1:8080/watchtower/ -o /tmp/xunia-watchtower.html
          grep -q 'RSI-01 // UNIVERSAL OVERSIGHT ENGINE' /tmp/xunia-watchtower.html
          curl -fsS http://127.0.0.1:8080/watchtower/ontology.json -o /tmp/xunia-watchtower-ontology.json
          python3 -c 'import json; x=json.load(open("/tmp/xunia-watchtower-ontology.json")); assert x["schema"]=="xunia.watchtower.ontology.v1"'
          curl -fsS http://127.0.0.1:8080/resources.html | grep -q 'Interactive Tools & Resources'
          curl -fsS http://127.0.0.1:8080/cyber-swarm/ | grep -q 'DEFENSE SWARM'
          curl -fsS http://127.0.0.1:8080/cyber-swarm/curriculum.json | grep -q 'xunia.cyber.swarm.curriculum.v1'
          curl -fsS http://127.0.0.1:8080/resources.json | grep -q 'green-house'
          curl -fsS http://127.0.0.1:8080/museum.js | grep -q 'STATIC_REPOS'
          curl -fsS http://127.0.0.1:8080/experiments.html | grep -q 'XUNIA Sightline'
          curl -fsS http://127.0.0.1:8080/status.html | grep -q 'XUNIAverse build status'
          curl -fsS http://127.0.0.1:8080/metrics.html | grep -q 'XUNIAverse metrics'
          curl -fsS http://127.0.0.1:8080/pipeline.html | grep -q 'agent pipeline'
          curl -fsS http://127.0.0.1:8080/holo/ | grep -q 'HOLO WORKABLE SIM'
          curl -fsS http://127.0.0.1:8080/holo/holo.js | grep -q 'XUNIA_HOLO_AAR_V1'
          curl -fsS http://127.0.0.1:8080/arcade/ | grep -q 'SUPER GALACTIK FEDERATION'
          curl -fsS http://127.0.0.1:8080/arcade/ | grep -q 'XUNIA ARCADE ENTRY GATE'
          curl -fsS http://127.0.0.1:8080/cte/ | grep -q 'ZYRA-CTE'
          curl -fsS http://127.0.0.1:8080/cte/ | grep -q 'Counterfactual Transaction Engine'
          curl -fsS http://127.0.0.1:8080/tak-os/live-3d/ | grep -q 'LIVE EARTH 3D'
          curl -fsS http://127.0.0.1:8080/tak-os/ | grep -q 'Common Operating Picture'
          curl -fsS http://127.0.0.1:8080/tak-os/manifest.webmanifest | grep -q 'TAK-OS Demo'
          curl -fsS http://127.0.0.1:8080/cte/ | grep -q 'SYNTHETIC-ONLY'
          if curl -fsS http://127.0.0.1:8080/eye-mouse/ >/dev/null 2>&1; then
            echo 'Unfinished prototype unexpectedly published.' >&2
            exit 1
          fi

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Assemble static site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R docs/. _site/
          touch _site/.nojekyll
          rm -f _site/holo/holo.js
          npx --yes -p typescript@5.6.3 tsc docs/holo/holo.ts \
            --target ES2020 \
            --lib DOM,ES2020 \
            --module ES2020 \
            --moduleDetection force \
            --strict \
            --skipLibCheck \
            --outDir _site/holo
          test -s _site/holo/holo.js
          test -f _site/resources.html
          test -f _site/resources.json
          test -f _site/arcade/index.html
          test -f _site/cte/index.html
          grep -q 'ZYRA-CTE' _site/cte/index.html
          test ! -e _site/eye-mouse

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify-public:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify canonical xunia.org routes
        env:
          CACHE_BUST: ${{ github.sha }}
        run: |
          set -euo pipefail
          arcade_ok=0
          for attempt in $(seq 1 20); do
            if curl -fsSL --max-redirs 8 -H 'Cache-Control: no-cache' "https://xunia.org/arcade/?v=${CACHE_BUST}" -o /tmp/xunia-arcade.html \
              && grep -q 'SUPER GALACTIK FEDERATION' /tmp/xunia-arcade.html \
              && grep -q 'XUNIA ARCADE ENTRY GATE' /tmp/xunia-arcade.html; then
              arcade_ok=1
              break
            fi
            sleep 2
          done
          test "$arcade_ok" -eq 1

          curl -fsSL --max-redirs 8 -H 'Cache-Control: no-cache' "https://xunia.org/?v=${CACHE_BUST}" -o /tmp/xunia-home-live.html
          grep -q 'The XUNIAverse Museum + HQ' /tmp/xunia-home-live.html
          grep -q 'Super Galactik Federation Arcade' /tmp/xunia-home-live.html

          cte_ok=0
          for attempt in $(seq 1 30); do
            if curl -fsSL --max-redirs 8 -H 'Cache-Control: no-cache' "https://xunia.org/cte/?v=${CACHE_BUST}" -o /tmp/xunia-cte.html \
              && grep -q 'ZYRA-CTE' /tmp/xunia-cte.html \
              && grep -q 'Counterfactual Transaction Engine' /tmp/xunia-cte.html \
              && grep -q 'SYNTHETIC-ONLY' /tmp/xunia-cte.html; then
              cte_ok=1
              break
            fi
            sleep 3
          done
          test "$cte_ok" -eq 1

          echo 'CANONICAL_XUNIA_ARCADE_LIVE=PASS'
          echo 'CANONICAL_XUNIA_CTE_LIVE=PASS'

          tak_os_ok=0
          for attempt in $(seq 1 20); do
            if curl -fsSL --max-redirs 8 -H 'Cache-Control: no-cache' "https://xunia.org/tak-os/?v=${CACHE_BUST}" -o /tmp/xunia-tak-os.html \
              && grep -q 'Common Operating Picture' /tmp/xunia-tak-os.html \
              && grep -q 'SIMULATED DATA' /tmp/xunia-tak-os.html; then
              tak_os_ok=1
              break
            fi
            sleep 3
          done
          test "$tak_os_ok" -eq 1
          echo 'CANONICAL_XUNIA_TAK_OS_LIVE=PASS'
          live_earth_ok=0
          for attempt in $(seq 1 20); do
            if curl -fsSL --max-redirs 8 -H 'Cache-Control: no-cache' "https://xunia.org/tak-os/live-3d/?v=${CACHE_BUST}" -o /tmp/xunia-real-3d.html \
              && grep -q 'LIVE EARTH 3D' /tmp/xunia-real-3d.html \
              && grep -q 'NO FAKE FALLBACK' /tmp/xunia-real-3d.html; then
              live_earth_ok=1
              break
            fi
            sleep 3
          done
          test "$live_earth_ok" -eq 1
          echo 'CANONICAL_XUNIA_LIVE_EARTH_3D=PASS'

      - name: Verify Tasmania Cesium Ontology public release
        run: |
          set -euo pipefail
          route_ok=0
          for attempt in $(seq 1 20); do
            if curl -fsSL --max-redirs 8 -H 'Cache-Control: no-cache' "https://xunia.org/tasmania/?v=${GITHUB_SHA}" -o /tmp/xunia-tasmania.html \
              && grep -q 'TASMANIA / CESIUM ONTOLOGY' /tmp/xunia-tasmania.html \
              && grep -q 'ontology-data.js' /tmp/xunia-tasmania.html; then
              route_ok=1
              break
            fi
            sleep 3
          done
          test "$route_ok" -eq 1
          curl -fsSL --max-redirs 8 "https://xunia.org/tasmania/data/ontology.json?v=${GITHUB_SHA}" -o /tmp/xunia-tasmania-ontology.json
          python3 -c 'import json; x=json.load(open("/tmp/xunia-tasmania-ontology.json")); assert x["schema"]=="xunia.tasmania.ontology.v1"; assert x["mode"]=="simulation"'
          for asset in app.js kraken-core.js models/DEVIL-01.glb; do
            curl -fsSL --max-redirs 8 "https://xunia.org/tasmania/$asset?v=${GITHUB_SHA}" -o /tmp/xunia-tasmania-asset
            test -s /tmp/xunia-tasmania-asset
          done
          curl -fsSL --max-redirs 8 "https://xunia.org/?v=${GITHUB_SHA}" -o /tmp/xunia-home-tasmania.html
          grep -q 'href="./tasmania/"' /tmp/xunia-home-tasmania.html
          echo 'CANONICAL_XUNIA_TASMANIA_LIVE=PASS'

      - name: Verify cyber learning swarm public release
        run: |
          set -euo pipefail
          cyber_ok=0
          for attempt in $(seq 1 25); do
            if curl -fsSL --max-redirs 8 -H 'Cache-Control: no-cache' "https://xunia.org/cyber-swarm/?v=${GITHUB_SHA}" -o /tmp/xunia-cyber-swarm.html \
              && grep -q 'XUNIA CYBER DEFENSE LAB' /tmp/xunia-cyber-swarm.html \
              && grep -q 'SYNTHETIC ONLY' /tmp/xunia-cyber-swarm.html; then
              cyber_ok=1
              break
            fi
            sleep 3
          done
          test "$cyber_ok" -eq 1
          curl -fsSL --max-redirs 8 "https://xunia.org/cyber-swarm/curriculum.json?v=${GITHUB_SHA}" -o /tmp/xunia-cyber-curriculum.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/xunia-cyber-curriculum.json').read_text())
          assert data['schema']=='xunia.cyber.swarm.curriculum.v1'
          assert data['mode']=='synthetic-defensive-training'
          assert data['provenance']['no_live_targets'] is True
          assert len(data['scenarios'])==15
          assert len({x['tactic'] for x in data['scenarios']})==15
          PY
          for asset in app.mjs engine.mjs style.css; do
            curl -fsSL --max-redirs 8 "https://xunia.org/cyber-swarm/$asset?v=${GITHUB_SHA}" -o /tmp/xunia-cyber-asset
            test -s /tmp/xunia-cyber-asset
          done
          curl -fsSL --max-redirs 8 "https://xunia.org/?v=${GITHUB_SHA}" -o /tmp/xunia-home-cyber-swarm.html
          grep -q 'href="./cyber-swarm/"' /tmp/xunia-home-cyber-swarm.html
          echo 'CANONICAL_XUNIA_CYBER_SWARM_LIVE=PASS'

      - name: Verify Universal RSI Watchtower public release
        run: |
          set -euo pipefail
          watchtower_ok=0
          for attempt in $(seq 1 20); do
            if curl -fsSL -H 'Cache-Control: no-cache' "https://xunia.org/watchtower/?v=${GITHUB_SHA}" -o /tmp/live-watchtower.html \
              && grep -q 'RSI-01 // UNIVERSAL OVERSIGHT ENGINE' /tmp/live-watchtower.html; then
              watchtower_ok=1
              break
            fi
            sleep 3
          done
          test "$watchtower_ok" -eq 1
          curl -fsSL "https://xunia.org/watchtower/ontology.json?v=${GITHUB_SHA}" -o /tmp/live-watchtower-ontology.json
          python3 -c 'import json; x=json.load(open("/tmp/live-watchtower-ontology.json")); assert x["schema"]=="xunia.watchtower.ontology.v1"'
          for asset in app.js style.css demo.json; do
            curl -fsSL "https://xunia.org/watchtower/$asset?v=${GITHUB_SHA}" -o /tmp/live-watchtower-asset
            test -s /tmp/live-watchtower-asset
          done
          curl -fsSL "https://xunia.org/?v=${GITHUB_SHA}" -o /tmp/live-watchtower-home.html
          grep -q 'href="./watchtower/"' /tmp/live-watchtower-home.html
          echo 'CANONICAL_XUNIA_WATCHTOWER_LIVE=PASS'
