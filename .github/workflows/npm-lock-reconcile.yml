name: Temporary npm lock reconciliation

on:
  pull_request:
    paths:
      - "package.json"
      - ".github/workflows/npm-lock-reconcile.yml"

permissions:
  contents: read

jobs:
  recompute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Recompute package-lock without scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify install and audit
        run: |
          npm ci --ignore-scripts --no-fund
          npm audit --audit-level=high
      - name: Emit generated lock in ASCII chunks for reviewable commit
        run: |
          node -e 'const fs=require("fs"),s=fs.readFileSync("package-lock.json").toString("base64"); console.log("LOCK_BEGIN:"+s.length); for(let i=0;i<s.length;i+=400) console.log("LOCK_CHUNK_"+String(i/400).padStart(4,"0")+":"+s.slice(i,i+400)); console.log("LOCK_END");'
