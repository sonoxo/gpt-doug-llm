name: Wakeup3lm Adaptive README

on:
  push:
    branches: [main]
    paths:
      - "wakeup3lm/**"
      - "tests/**"
      - ".github/workflows/**"
    paths-ignore:
      - "wakeup3lm/README.md"
      - "wakeup3lm/assets/ecosystem.svg"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate adaptive README and infographic
        run: python wakeup3lm/docs/generate_ecosystem_readme.py
      - name: Commit generated documentation when repository state changed
        run: |
          if git diff --quiet -- wakeup3lm/README.md wakeup3lm/assets/ecosystem.svg; then
            echo "README already current"
            exit 0
          fi
          git config user.name "wakeup3lm-doc-bot"
          git config user.email "actions@users.noreply.github.com"
          git add wakeup3lm/README.md wakeup3lm/assets/ecosystem.svg
          git commit -m "docs(wakeup3lm): refresh adaptive ecosystem view [skip ci]"
          git push
