name: GPT-Doug TAK-OS Live Earth 3D / Real Source Gate
on:
  pull_request:
    paths:
      - 'docs/tak-os/live-3d/**'
      - 'docs/tak-os/gateway.py'
      - 'docs/tak-os/index.html'
      - 'docs/tak-os/styles.css'
      - 'docs/resources.json'
      - 'tests/test_tak_os_live3d*'
      - '.github/workflows/tak-os-live3d.yml'
  push:
    branches: [main]
    paths:
      - 'docs/tak-os/live-3d/**'
      - 'docs/tak-os/gateway.py'
      - 'docs/tak-os/index.html'
      - 'docs/tak-os/styles.css'
      - 'docs/resources.json'
      - 'tests/test_tak_os_live3d*'
      - '.github/workflows/tak-os-live3d.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-real-earth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Real ontology ingestion and stale-data contract
        run: node --test tests/test_tak_os_live3d.js
      - name: Local route/CSP/security test
        run: python3 -m unittest discover -s tests -p 'test_tak_os_live3d.py' -v
      - name: JavaScript syntax
        run: |
          node --check docs/tak-os/live-3d/ontology.js
          node --check docs/tak-os/live-3d/live-earth.js
          node --check docs/tak-os/live-3d/cesium-config.js
          node --check docs/tak-os/live-3d/iphone-grid.js
          node --check docs/tak-os/live-3d/sw.js
      - name: Ensure no real-world fake-fallback records
        run: |
          ! grep -E 'const demoUnits|seed = \[|const fakeEvents|Math.random\(' docs/tak-os/live-3d/live-earth.js
          test -s docs/tak-os/live-3d/index.html
          test -s docs/tak-os/live-3d/manifest.webmanifest
          test -s docs/tak-os/live-3d/iphone-grid.css
          grep -q 'mobile-map-tools' docs/tak-os/live-3d/index.html
          grep -q 'data-close-panel' docs/tak-os/live-3d/index.html
          grep -q 'NO FAKE FALLBACK' docs/tak-os/live-3d/index.html
