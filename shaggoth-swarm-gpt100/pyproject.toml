[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shaggoth-swarm-gpt100"
version = "0.2.0"
description = "Safe-by-default 100-agent orchestration framework"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "sonoxo"}]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
shaggoth = "shaggoth_swarm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
