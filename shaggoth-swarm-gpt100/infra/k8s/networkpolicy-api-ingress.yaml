apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-from-namespace
  namespace: shaggoth-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: shaggoth-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: shaggoth-system
      ports:
        - protocol: TCP
          port: 8787
