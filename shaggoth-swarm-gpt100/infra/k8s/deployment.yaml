apiVersion: apps/v1
kind: Deployment
metadata:
  name: shaggoth-api
  namespace: shaggoth-system
  labels:
    app.kubernetes.io/name: shaggoth-api
    app.kubernetes.io/part-of: shaggoth-swarm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: shaggoth-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shaggoth-api
        app.kubernetes.io/part-of: shaggoth-swarm
    spec:
      serviceAccountName: shaggoth
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: shaggoth-api
      containers:
        - name: api
          image: shaggoth-swarm-gpt100:0.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8787
          envFrom:
            - configMapRef:
                name: shaggoth-config
            - secretRef:
                name: shaggoth-secrets
                optional: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
