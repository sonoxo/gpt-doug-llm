name: Validate North Star Federation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -U pip pytest
      - name: Install federation package
        run: python -m pip install -e .
      - name: Validate registry
        run: python -m north_star_federation validate
      - name: Run tests
        run: python -m pytest -q
